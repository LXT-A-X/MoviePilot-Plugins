name: Build Vue Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'plugins.v2/embypeoplelocalize/src/**'
      - 'plugins.v2/embypeoplelocalize/package.json'
      - 'plugins.v2/embypeoplelocalize/vite.config.js'
      - 'plugins.v2/embypeoplelocalize/index.html'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins.v2/embypeoplelocalize
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Commit dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[skip ci] Build Vue frontend dist"
            git push
          fi
