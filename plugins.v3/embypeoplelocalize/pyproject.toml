# v4.6.71(操作逻辑与漏洞修复 · 批次2/4：第二排角色跨集复用): 新增「同剧角色翻译记忆」（报告第二十~三十四节）—— 同一部剧里反复出现的同一角色，第 1 集翻过之后，后续集 / 后续轮次 / 洗版重建都直接复用，不再调 AI（AI 请求、Token、429 概率大幅下降）。①【db · 新表 role_memory】schema v11（幂等建表 + 迁移兜底），键 = (plugin_id, server_id, series_id, role_original)；`role_memory_get` 批量取、`role_memory_put` 批量写（源优先级 manual > llm > tmdb > zhconv > reused，**人工永不跌级**）、`role_memory_delete_series` 只由显式「清除该剧角色翻译记忆」调用、`role_memory_stats / role_memory_of_item` 供 UI。与 person 表**解耦** —— 删除某集 / 整剧删除 / 恢复 / 清空翻译记录都不清记忆，洗版后同名媒体身份（TMDB/TVDB）直接命中。②【worker · 命中】`_translate_pending_round` 在送 LLM 之前按 (server_id, item_id, 角色原文) 查同剧记忆，命中即作为「角色 hits（source=series）」直接写库并计数，不调 AI；作用域含 server_id → 同一角色名在不同作品可各自有译文（Guardian→守护者 / 守门人 并存）。③【worker · 批内去重】`_tx_llm_chunks` 按 (kind, 原文) 去重后只送唯一值，结果扇出到全部 occurrence —— 一次送入 3×Dark Knight + 2×Captain 只发 1 次请求（2 条），此前会重复发送 5 条。④【worker · 落记忆】本轮 LLM / 繁转简 / 复用结果写回 role_memory，下一轮与后续集立即命中。⑤【强制重翻绕过】条目级「重新翻译」走 force 分支（在记忆查询之前提前返回）→ 强制重翻必然忽略旧记忆、重新进 AI，重翻后刷新记忆。⑥【人工优先】库页「编辑译文」改角色时写入 role_memory(source=manual)，同剧后续集直接复用人工结果，AI 不得覆盖。⑦【新增接口/入口】GET /db/role_memory（统计 + 某剧明细）、POST /db/role_memory/clear（记忆唯一清除入口，带任务锁）；库页「编辑译文」弹窗新增「清除该剧角色记忆」按钮。新增回归 14/14；全套回归 332 项 0 失败。
