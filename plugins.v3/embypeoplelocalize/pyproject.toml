# v4.6.73(操作逻辑与漏洞修复 · 批次4/4：文件锁 / 条目互斥 / 统一任务状态): 报告第十二 / 十五 / 十六节 + 十九节测试 10。①【文件级锁（第十二节）】nfo.py 新增 file_lock(nfo_path)（进程内按路径互斥，大小写/分隔符归一）—— _restore_nfo_from_db 用 with file_lock(nfo_path) 包裹真实现 _restore_nfo_from_db_locked，使同一 NFO 的「重新读取磁盘 → apply → 原子写回」全程串行，防止写回 worker / 手动全部写回 / 单条写入两个线程同时写同一文件互相覆盖。②【写回复读校验】落盘后重新 parse 校验文件可读（verified 字段），失败记 WARN 并上报（不静默）。③【条目级互斥（第十六节）】新增 _item_lock/_item_enter/_item_leave/_item_busy（键 = server_id + item_id）—— 同一条目同一时刻只跑一个写回/重翻，_wb_process_item 用条目锁包装（忙则本轮跳过，其它条目不受影响）；/translate/jobs/create 对该条目忙时拒绝并提示「同一条目互斥」。④【统一任务状态机（第十五节）】新增 _task_state()：IDLE/SCANNING/PROBING/TRANSLATING/WRITING/POOL_FETCHING/POOL_SYNCING/STOPPING + data_mutation_locked（任一非 IDLE 即锁），优先级 STOPPING > WRITING > TRANSLATING > SCANNING > PROBING > POOL_FETCHING > POOL_SYNCING；/pool/status 与仪表盘状态都附 task_state。⑤【前端任务状态 UI】useTaskGuard 消费 task_state/data_mutation_locked 并映射中文状态（stateLabel），TaskGuardDlg 新增 state 展示「任务状态：… （数据变更已锁定）」，库页/人名池页传入。新增回归 38/38（含 file_lock 归一/条目互斥/状态机优先级/真实原子写回）；全套回归 396 项 0 失败。
# v4.6.74(本轮复查：P0 角色跨作品隔离 + 人名改名作用域 + 统计拆分): ①【P0 角色去重必须带作品身份】`_tx_llm_chunks` 批内去重键此前是 `(kind, 原文)`——**全局聚合模式下 A 剧 Guard 与 B 剧 Guard 被压成一条，结果互相扇出（不同作品同名角色串译）**。现改为：角色 → `(role, server_id, 作品身份 series_media_id/item_id, 原文)`（同剧 E01/E02/E03 仍合并为一条 → 跨集复用不变；B 剧独立成条 → 可得到不同译文）；人名 → `(person, 原文)` 保持全局（第一排本就是全局人名池设计）。新增 `_tx_work_id()`（series_media_id 优先，退化 item_id）。②【P0 角色不得跨作品复用全局记忆】`_tx_translate_mixed` 不再对角色查全局池（name_map 跨作品聚合，A 剧「Guardian→守护者」会污染 B 剧）—— 角色只认「同剧角色记忆」role_memory（命中不调 AI），未命中直接进 LLM；写回 `_restore_nfo_from_db` 同样不再回退角色全局池（否则 B 剧写回会落 A 剧译文）。人名保持全局池回退不变。③【P1 人名改名默认只改当前身份】新增 `db.update_name_by_scope`（single 仅当前这一条 / series 该作品内同名 / library 全库同名）与 `_api_db_update_person_scope` 的 `name_scope` 参数（后端默认 single 兜底）；库页编辑弹窗新增「范围」选择（默认「仅这一条」，「全库同名」标红 + 危险确认「这会修改所有同名人物，可能包含不同真人」）；**只有 library 才写全局人名池**（局部改名不再污染其它作品的同名人物）。④【P1 统计完全拆分】`_kind_stat` 拆出「角色 Memory（source=series）」与「TMDB」；完成通知改为每项一行：`第一排/第二排：完成 N 条` + `• LLM / • 角色 Memory / • 人名池 / • TMDB / • 繁转简 / • LLM 输出简体化 / • 失败`（只显示非 0 项）；`[TranslateJob]` 结束日志补「角色记忆 N」。⑤【P1 强制重翻】重翻结果刷新「同剧角色记忆」（此前重翻后记忆仍是旧译文，下一集又复用旧的）+ 返回分排统计 by_kind（通知不再恒显示 0）。新增回归 34/34；全套回归 430 项 0 失败。
# v4.6.75(最终发布规范：多季 UI / 范围严格生效 / AI 聚合自证 / 任务结束即时刷新): ①【多季详情 UI（规范 §二-1/2/3、§十一）】季选择器此前 flex-wrap 无限换行，季数多时把剧集列表顶出屏幕 —— 现限高 92px + overflow-y:auto 自身滚动（移动端 S1-S20 也不撑长）；季序改**按季号数字排序**（S1/S2/S3/S10/S20，不再 S1/S10/S2 字符串序），季内剧集按集号排序；切季时重置该季懒加载计数、先销毁旧 IntersectionObserver 再重建（不残留上一季观察）、并把视图滚回本季开头（E01）；单季仍不显示选择器、当前季高亮、季标签带集数与观察期警告数（不变）。②【翻译范围严格生效（§三-1/2）】**人名池 = 第一排** —— 池行此前作为 kind=person 直接入列，未过目标范围门禁（未分类旧行会漏翻第一排）：现收词前统一检查「目标范围含第一排 + 第一排人名总开关」，范围不含第一排时池内人名一律不翻；`/pool/translate` 同步明确拒绝并提示（不再静默启动空转、池永远停在待翻译）。③【AI 聚合自证（§四-3、§十-3）】`_tx_llm_chunks` 回报「输入 N 条 → 去重后唯一 M 条」，贯穿 `_tx_translate_mixed` → 轮次 → Job 统计（`_tx_job_dedup_in/uniq`）；Job 结束日志打印「输入 N → 去重后 M 条（省 K 条）」、完成通知新增「🧮 AI 聚合：输入 N → 去重后 M（省 K 条重复请求）」—— 日志能自证「几条词条 = 几次请求」。④【任务结束即时刷新（§五-1/5）】库页 `loadStatus` 检测翻译/写回「运行中 → 结束」跳变，结束后**立即**重读详情 / 待翻统计 / 列表 / 明细弹窗（此前只靠 30s 定时器，会出现「翻译已完成但界面仍显示未翻译」）。⑤【核查确认已达标（本轮只验证未改动）】429 指数退避 60→120→240→600 带抖动、quota/auth 硬停 30 分钟且 worker 在窗口内不发请求（暂停态为内存态 = 重启即恢复，策略明确）；定时扫描仅在 `_schedule_enabled` 开启时触发、按「上次执行 + 间隔」判定、与后台任务互斥、未选库不空转；写回回读校验 + 文件锁 + 条目锁 + 删除/恢复/洗版稳定身份（v4.6.72/73/74 已交付）。新增回归 44/44；全套回归 474 项 0 失败。
# v4.6.76(P0 大事故修复：Webhook 删除事件误通知 —— 「插件管理身份」门禁): 报告 §一~§四 / §七 / §十一~§十三 / §二十~§二十三。①【P0 · 删除未知媒体必须完全静默】`_handle_webhook_delete` 此前只要通过「已选媒体库」预检就无条件登记 missing 事件 + 发 QQ 通知（命中 0 条也照发）—— 「选定媒体库」只能说明路径属于用户选的库，**不能证明插件扫描过该媒体**。现新增 `db.media_probe()`（Managed Identity Probe）：按server+emby_item_id → server+(provider,media_id) → item_id → series_media_id → nfo_path → 剧名+季集（候选）→ 历史 alias 逐级探测 person 表（含观察期行）；完全未命中 → 直接 DEBUG 日志返回，**不建事件 / 不进入观察期 / 不通知 / 不写库**。②【状态机（§三）】A 未管理 → 静默；B 弱匹配多候选 → 事件状态 `ambiguous`（「需确认」）+ WARNING 日志，不自动标记观察期、不发普通删除通知；C 确认管理且行级标记成功 → missing + 聚合通知；D managed 但行级标记 0（竞态/命名差异）→ 异常保护：登记 ambiguous 事件、不发普通通知。③【稳定身份兜底标记（§九-42~44）】新增 `db.mark_deleted_by_media()` —— 洗版/Remux/nfo 改名导致路径不一致时，用 provider / item_id / emby_item_id / series_media_id 兜底标记观察期（整剧删除标全层级、单集只标本集）。④【通知文案（§五/§二十）】「同 ID 新版本入库自动恢复」→「观察期内重新入库时将自动尝试按媒体稳定身份恢复（Emby ID / TMDB / TVDB / IMDb）」；聚合通知标「已删除 N 个**已管理**条目」+「实际进入观察期 X 条」。⑤【手动清理（§七/§二十二）】新增 `db.count_missing()` —— 0 条时返回「当前没有插件管理的失效记录，无需清理」（不再做成『已清除 0 条』的动作反馈）；有则「已永久清除 X 条插件管理的失效记录」；清理只删 person 观察期行，**不动 role_memory / media_identity_alias**；前端按钮无失效记录时置灰。⑥【脏事件清理（§二十三）】启动时按数据库真实记录核对，移除旧版误登记的 missing 事件（数据库连对应媒体都没有的），保留真实失效事件。⑦【任务锁补齐（§十一）】`_api_name_map_update` / `_api_name_map_delete` / `_api_pool_translate` / `_api_pool_sync` / `_api_pool_sync_one` 全部接入 `_task_busy_msg()`；`_task_busy_msg` 口径扩为统一「数据变更锁」（扫描/翻译/写回/人名池/探测库任一在跑即拒绝）。⑧【配置热改与 Job Snapshot（§十二/§十三）】任务创建时冻结翻译配置快照（person/role/类型开关/处理单集/scope），运行中改设置**不影响当前任务**（新设置从下个任务生效）；任务结束释放快照。前端 Webhook 事件状态新增「需确认」（ambiguous）。新增回归 39/39（含 §26 测试 A~E：空库删除未知媒体静默 / 12 集整剧删除命中 / 普通 Folder 静默 / 路径变化靠 provider 恢复 / 多候选需人工确认）；全套回归 513 项 0 失败。
# v4.6.77(观察期翻译口径 + 观察期编辑保留 + 到点清理闭环): ①【观察期行不参与翻译口径】用户实测发现：被删条目/剧集里**未翻译**的词条仍会被算进「待翻译统计」并可能被 worker 拿去调 AI（文件都已不在，纯浪费配额）。现新增 `_ALIVE_SQL` 并统一进 `db._excl_ep_sql`（与「处理单集」门禁同一处），一次覆盖全部待翻入口：`pending_terms` / `pending_terms_full` / `pending_items_count` / `pending_items_list` / `pending_terms_of_item` / `find_pending_items` / `force_item_occurrences` / `force_item_terms`。语义：观察期内的行**不参与翻译**（不统计、不收词、不调 AI）；**译文本身不清除** —— 观察期内重新入库（deleted_at 清空）后自动回到待翻队列；只影响被删的那一集，同剧其它集照常翻译；观察期行也不再阻塞该条目的写回就绪判定。②【观察期内人工编辑依然安全】确认并锁定语义：观察期内的编辑照常落到该行（编辑不会解除观察期）；重新入库时按「序号/原文」继承人工译文，不丢修改；角色人工修改仍写入同剧角色记忆（manual 最高优先级）。③【到点清理闭环】观察期到点仍未恢复 → 维护线程/扫描清理记录后，**同步清掉对应的「失效/待恢复」事件**（`_cleanup_dirty_webhook_events` 按数据库真实记录核对），不再残留「待恢复」假象；清理仍是**行级**的 —— 删一集只清那一集，其它集与整部剧不受影响；`role_memory` / `media_identity_alias` 一律保留（重新入库仍可按稳定身份恢复译文）。新增回归 33/33；全套回归 546 项 0 失败。
# v4.6.78(入库链路「是否已交后台翻译」文案按真实触发 —— 修误导性提示): 用户实测：**没开「Webhook 入库后自动翻译」**，但通知仍写「⏳ 状态：已接收，已安排翻译（插件将自动处理）」、日志仍写「待翻 N 个词条已交后台翻译 worker」—— 这些都是**静态文案**，不检查开关，让人以为正在自动翻译。①【新增 `_ingest_tx_phrase(trigger, pending)`】按真实触发产出短语：auto_trigger → 「已交后台翻译 worker（自动）」；manual_trigger → 「已交（本次手动触发）」；enqueue_only（开关关 / AI 总开关关）→ 「未自动翻译（设置页「入库后自动翻译」未开启，可在库页点「全部翻译」手动触发）」；pending=0 → 「无待翻词条」。②【接收通知状态行】改为按 `_nfo_ingest_trigger()` 分叉：「已安排翻译（插件将自动处理）」/「仅入库 —— 未自动翻译（…可手动触发）」；「🕒 延迟」说明同步区分「开始翻译」与「开始入库（与翻译无关）」；合并轮次的「已合并」也标注是否自动翻译。③【入库日志/事件文案】Webhook 单条入库、同剧聚合、整剧入库、恢复入库、入库完成事件的 7 处文案全部改走 helper，不再有无条件「已交后台翻译 worker」；整剧入库日志按开关区分「已交后台翻译」/「仅入库，未自动翻译」。④【入库完成通知的「待翻」行】改为对两种来源都成立的表述：「按当前翻译范围；开启「入库后自动翻译」的会自动处理，否则请在库页点「全部翻译」」。仅文案与提示，翻译行为本身未改（未开开关时本来就不会自动翻译）。新增回归 20/20；全套回归 566 项 0 失败。
# v4.6.79(人名池「类型」显示口径：演员类合并为「演员」): 人名池那一列的类型此前是「这台 Emby 服务器 + 已选媒体库里，该人出现过的所有类型的并集」——同一个人 A 片客串、B 片主演就会显示成「演员 / 客串」（Person 实体类型是按服务器全库聚合的，不是一个作品里的类型）。按需求调整显示口径：**主演 Actor / 声优 VoiceActor / 客串 GuestStar 三者都算演员**，显示层统一合并为一枚「演员」；导演 / 编剧 / 制片 等「特别身份」不合并、各自单独显示（「演员」排在最前）。实现：`PeoplePoolView.vue` 新增 `ACTING_TYPES = ['Actor','VoiceActor','GuestStar']` 与 `ACTING_LABEL = '演员'`，`typeList()` 把演员类折叠成单枚「演员」再拼接特别身份（列表行 / 人员卡片 / 编辑弹窗三处显示同源，一并生效）。**仅改显示**，库页（LibraryView）明确不动；筛选下拉（按原始 Emby 类型筛选）、拉取类型、重筛、翻译类型开关仍走原始类型，功能完全不变。新增回归 28/28（含 Node 跑真实提取函数 16 个行为用例）；全套回归 594 项 0 失败。
# v4.6.80(「中文里带空格」的名字不再被判成待翻译 —— 修「批量翻译没反应/一直未翻译」): 用户实测：人名池里「角田 雄二郎」（汉字 + 一个空格，日文姓名写法）一直显示「🔴 待翻译」，点「批量翻译」只见「收到翻译许可」后「就没有然后了」，人名池与译文都没变化。根因：「是否已是中文」的判定此前把「汉字夹空格」的名字排除在中文之外（`_is_spaced_cjk_name` 特判），于是它被判「待翻译」；但繁简转换对纯汉字是**空操作**、LLM 也多半原样返回 → 永远停在「待翻译」，每轮重复收词、重复尝试（纯浪费 AI 配额）。而前端保存判定只认汉字（不含空格排除）→ **前后端口径不一致**，同一名字在保存时「无需翻译」、在池里却「待翻译」。①【统一口径（db.py）】`_is_chinese_text` 改为「含汉字 **且无假名** → 视为已是中文」，空格不再是排除条件（含假名的「水桥 かおり」仍需翻译）；同步 `_SQL_IS_ZH`（去掉 `AND NOT _SQL_HAS_NAME_SPACE`），保证「Python 推导」与「SQL 统计」判定完全一致。`_is_spaced_cjk_name` 文档字符串标注「v4.6.80 起仅为兼容保留、不再作为排除条件」。②【前端对齐（PeoplePoolView.vue）】`isChineseText` 同步改为「含汉字且无假名」，与后端零分歧。③【一轮 0 产出的原因可见】`_translate_pending_round` 在「无可消费词条」时新增诊断日志（来源 / 范围 / 库内第一排·第二排开关 / 池是否收到），不再静默返回 —— 下次遇到「点了没反应」能直接从日志看出为什么。新增回归 22/22（Python 口径 / 真 SQLite 池状态统计 / Node 跑真实提取函数）；全套回归 616 项 0 失败。
# v4.6.81(库页左栏海报「空框」修复：海报误用 item_id 拼图 → 改用 Emby 条目 ID + 前端失败回退图标): 用户实测：库页左栏每一行左侧是个 23×33 的空框 —— 海报与灰色电影图标都不显示（devtools 抓到的是 `.v-img.epl-thumb` 空框、内部 `<img style="display:none">`）。①【根因】左栏海报 URL 在 `_annotate_db_items` 里用 `item_id` 拼：`f"{u}/Items/{item_id}/Images/Primary"`，但 v4.6.66 起 `item_id` 存的是**媒体身份**（tmdb/tvdb/imdb/nfo:hash），Emby 条目 ID 单独在 `emby_item_id` 列 —— 等于「拿 TMDB id 当 Emby id 去要图」。实测（只读请求打用户 Emby 验证）：`/Items/296101/Images/Primary` → HTTP 500（无此条目）；`?AnyProviderIdEquals=tmdb.296101` → 真实 Emby id = 31715 / 32042；`/Items/31570/Images/Primary` → 200 image/jpeg 122KB。图片 500 → `v-img` 加载失败 → 空框；而灰色图标只是「无海报」时的兜底，被海报顶掉后不再出现。右侧海报不受影响（走 `/poster` 接口，服务端 `search_item_by_provider` 先把 tmdb 反查成真实 Emby id 再取图）。②【后端修复】`db._group_person_rows` 带出 `emby_item_id`（组内**非 Episode 行优先**，集行自带的是分集 ID）；`_annotate_db_items` 改用 `it.get("emby_item_id")` 拼 `/Items/{emby_id}/Images/Primary`；**没有 emby_item_id 的行不再设 poster_url**（前端自然回退灰色图标）。③【前端兜底】`LibraryView.vue` 左侧海报新增 `failedPosters` 集合 + `thumbOk()/onThumbError()`：`v-img` 加 `@error`，任一海报加载失败即把该条目回退为灰色 `mdi-movie-outline` 图标 —— 无论图片因何失败都不再留空框（且不影响其它行）。新增回归 23/23（含真实 SQLite 分组、真实方法体 `_annotate_db_items`、Node 跑真实提取的 thumbOk/onThumbError）；全套回归 639 项 0 失败。
