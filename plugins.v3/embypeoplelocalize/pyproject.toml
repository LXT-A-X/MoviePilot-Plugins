# v4.6.84(容器级删除先探测 / 剧级行恢复 / 清除失效同步清事件 / 入库事件一行 / 恢复条数口径): 用户实测（Emby 事件 `library.deleted` + `Type=Series, IsFolder=true, Id=32027`，报文标题「移除了 某剧 中的 3 项」）—— 用户只把 **3 集（视频 + nfo）移走**，Emby 却按**整部剧（容器）**发删除事件。①【容器级删除先探测（P0）】`_handle_webhook_delete` 收到 `series/season/folder` 级删除时，标记前先问 Emby 该容器条目**是否仍存在**（`fetch_item`）；仍在 = 只是内容变动（缺了几集）→ **不整树标记**（不写库、不建事件、不通知）。此前照着 Item 按 `nfo_path` 前缀整树标记 → 整部剧 86 条被误标观察期。探测不到（Emby 不可达 / 无客户端）→ 保持原行为照常标记，不漏标真删除。②【剧级行恢复（P0）】`_locate_nfo_from_item` 此前对容器条目一律 `dirname(Path)` —— 而 Series 的 Path **本身就是剧集目录**，于是 tvshow.nfo 被到「上一级」去找、永远定位不到 → 剧级行从不重新入库 → 剧名一直「待恢复」、失效事件与到期时间都不消。现对容器条目同时尝试「Path 本身」与「上一级」。另：单集入库补写剧级行的判据 `item_has_series_row` 新增 `exclude_deleted`（补写时传 True）—— 观察期行不再算「已有剧级行」，剧级行得以重新写回并解除观察期。③【清除失效同步清事件】`_api_db_purge_missing` 在「数据库已无失效记录（0 条）」分支里也会调用 `_cleanup_dirty_webhook_events` 清掉残留的「失效 / 待恢复」事件行 —— 修「点了清除说成功、列表里的行却没删」。④【入库事件列表一个事件一行】`_update_or_push_webhook_event` 由「只匹配 received」改为匹配全部**非终态**（received/running/waiting），并把单集 `done`、整剧 `running/failed/skipped`、挂起 `waiting`、整合 `running`（改为按成员逐个更新）等写入统一走它 —— 事件列表里一个事件只占一行、状态原地流转（已接收 → 处理中 → 完成/失败），不再出现「已接收」+「完成」两行。⑤【恢复条数口径】通知「🔄 其中已恢复被删条目 N 条」此前数的是**通知批次条目**（一次整剧入库恒为 1，与日志 recovered=13 对不上）；现改为按**恢复的 NFO 文件数**求和，文案改「N 个（重新入库）」。新增回归 28/28；全套回归 674 项 0 失败。
# v4.6.85(容器仍在 Emby 时「只标真正消失的那几集」—— 你删掉的那 3 集不再被忽略): 承接 v4.6.84（容器级删除先探测：容器还在就不整树标记）。用户追问「那真删掉的几集不就查不到了吗」—— 是的，v4.6.84 的「容器仍在 → 直接返回」会把真实删除的集一起放过。本版补上精确比对：①【差集比对】新增 `_reconcile_missing_episodes()` —— 容器仍在时，取「库里登记的季集」（`db.episode_pairs_under_prefix`）与「Emby 实际的集列表」（`client.get_series_episodes`）做**差集**，得到真正消失的 `[(season, episode), ...]`；任一侧数据缺失（无库记录 / Emby 拉不到 / 非 Series 容器）→ 返回空，**宁可不标也不乱标**。②【精确标记】新增 `db.mark_deleted_episodes_by_prefix()` —— 只把这几个集的行标记观察期（限定在该剧目录前缀内），同剧其它集与剧级行**一律不碰**（与此前「整树标记」相对）。③【可见性】登记一条「失效 / 待恢复」事件，写明「已不存在 N 集（S01E02、S01E05…）」+ 到期时间，并发聚合删除通知（含集数）。④【效果】你只删 3 集 → 失效列表就显示这 3 集、也只标这 3 集；容器真被删（Emby 里也查不到）→ 仍按 v4.6.84 的整树标记。新增回归 24/24（v484 用例同步扩到 29）；全套回归 699 项 0 失败。
# v4.6.86(删整季也精确：季容器支持 + 枚举不到时退化为「只标该季」): 承接 v4.6.85（容器仍在时只标缺失的集）。用户提问「删掉第一季，第二三季能保留吗？第一季能标到吗」—— 本版把**季容器**这条路径补齐，并明确两种「空」的语义：①【季容器支持】`_reconcile_missing_episodes` 增参 `itype`：Series 容器走 `client.get_series_episodes(剧 Id)` 拉全剧集，Season 容器走 `client.query_items(ParentId=季 Id, IncludeItemTypes=Episode)` 拉该季的集。②【区分两种「空」】返回值改为 `(缺失集, 是否枚举成功)` —— 此前「Emby 返回空」既可能是「一集不缺」也可能是「压根拉不到」，无法区分；现在 `([], True)` = 枚举成功且无缺失（不标）、`([], False)` = 枚举不到（交调用方兜底）。③【季容器兜底】季容器枚举不到（Emby 保留了空季 / 子集查询失败等）→ 退化为「只标该季目录」（`db.mark_deleted_by_nfo_path_prefix`）：范围仍限这一季，**绝不波及其它季或整剧**。④【结论】删第一季 → 第二/三季**保留不动**；第一季：能列出剩余集就**只标缺的那几集**，列不出就整季标记（仍只限这一季）。新增回归 28/28；全套回归 703 项 0 失败。
# v4.6.87(整剧入库文案加「季数描述」): 用户反馈：多季剧入库时，「入库事件」/日志/通知只写总量（N 个 nfo），看不出覆盖了哪几季。①【新增 `_seasons_range_txt()`】把季号集合压成紧凑描述 —— 连续段用「–」连写、不连续用「、」分隔（`[1,2,3,4]` → `S01–S04`；`[1,3]` → `S01、S03`；`[1]` → `S01`；空 / 脏值 → 空串）；乱序去重、集合入参、两位数季号都支持，异常一律返回空串（绝不抛）。②【接入整剧入库四处】`_translate_series_expanded`：运行中事件「整剧入库：展开为 N 个单集任务【S01–S04】，…」、完成事件「整剧入库：X 个 nfo【S01–S04】（成功 X，失败 0）｜采集…」、日志（展开行 / 完成行）、完成通知标题（`剧名【S01–S04】`）。无季信息时为空串 → 不出现空括号，文案与旧版完全一致。新增回归 19/19；全套回归 722 项 0 失败。
# v4.6.88(修「先 Webhook 入库、后扫描」同一文件重复 —— 扫描复用已有 server_id): 用户实测（真实 DB 复现）：先 Webhook 入库（行带真实 server_id）→ 再点「扫描」，同一集出现**两份记录**（3 行 + 3 行 = 6 行；库页同一部剧变成 **2 个条目**）—— 人数各算一半、待翻两边都进（重复调 AI）、写回可能写两次。反向顺序（先扫描 → 再 Webhook）**不重复**（`upsert_people` 的「遗留行来源迁移」把 '' 收编成真实来源），只有「先入库后扫描」中招。①【根因】扫描是本地文件扫描、没有服务器上下文 —— `_nfo_sync_worker` 调 `_record_nfo_library` 时**没传 server_id** → 落库为 ''；而 `upsert_people` 的「删旧行 / 清观察期」都按 `server_id=?` 隔离 →两套记录互不覆盖、只能新增。另：扫描断点只记「扫描自己处理过的文件」，Webhook 不写断点 → 扫描把它们当新文件重收。②【修法】新增 `db.server_id_by_nfo_path()`：该 nfo_path 已登记记录里的**唯一**非空 server_id（无记录 / 多个不同来源 → 返回 ''）。`_record_nfo_library` 在 `server_id` 为空时先用它复用已有来源再 upsert → 命中同一组（**覆盖而非新增**）。多台 Emby 映射同一本地路径时保持 ''（不误归属）。③【顺带清理存量】修复后再次扫描即自动收编：实测「6 行 / 2 条目」→「3 行 / 1 条目」。新增回归 16/16（含旧 bug 复现护栏）；全套回归 738 项 0 失败。
# v4.6.89(新增「整剧入库只收新增」开关 —— 默认关): 用户实测：Emby 提示「已添加了 3 项到 某剧」，但事件 Item 是 **Series**（`Type=Series, IsFolder=true, Id=32027`）→ 插件按「整剧展开」把该剧 Emby 里**现有的全部集**入库（日志 `Series 展开为 13 个单集任务【S01】` / `nfo=14`= 13 集 + tvshow）→ 用户从没入库过的旧集（1~10）也一并进来。①【新开关 `series_new_only`（默认**关**）】开启后，剧级事件展开时按 Emby `DateCreated` **只入库最近 7 天加入的集**，其余旧集跳过并计数；关闭时保持「整剧全收」（默认不变，既有行为零改动）。②【判定与兜底】`_emby_date_ts()` 手写正则解析 Emby 时间戳（`2026-10-08T16:24:48.5607219Z`，兼容 3.10 的 `fromisoformat` 不认 `Z`/7 位小数秒）→ 早于阈值 = 旧集跳过；**缺日期/解析失败视为新集（宁可多收，也不漏掉刚加的）**；整批一个可用日期都没有 → 退回整剧入库（行为不劣于旧版）。③【接入与可见】Series 展开在「定位 nfo」之前过滤（不为旧集浪费定位/重试）；即使全被跳过也不早退 —— **tvshow 仍入库**（保证该剧在库页可见）；日志 / 入库事件 / 完成日志写明「跳过旧集 N 个（只收新增）」。④【Emby 字段】`get_series_episodes` 的 Fields 补 `DateCreated`。⑤【设置项】设置页「Webhook 入库」区新增开关「整剧入库只收新增」（含口径说明）。新增回归 31/31；全套回归 769 项 0 失败。
# v4.6.90(整剧入库默认「只收本次新增」—— 开关改为「整剧全收」默认关): 承接 v4.6.89（曾新增开关但**默认关** = 默认整剧全收）。用户明确口径：「我入库如果那个没开，那我们这边就只收我们那三个，就是 10~13 集」—— 即**默认只收本次新增的那几集**，想整剧补齐时点「扫描」。故本版把开关**反过来表达**：设置项改名「整剧全收（包含旧集）」、**默认关** → Emby 发「整部剧」事件时**只入库本次新增的集**（最近 7 天加入的，按 Emby `DateCreated`）；打开才把该剧 Emby 里现有的全部集入库。①【常量】`CFG_SERIES_NEW_ONLY` → `CFG_SERIES_INGEST_ALL`（默认 False），旧键**彻底移除**（不留双开关）。②【口径】`_translate_series_expanded` 过滤条件改为 `not _series_ingest_all` —— 默认即只收新增；即使全被跳过也不早退，**tvshow 仍入库**（保证该剧在库页可见）；日志 / 入库事件 / 完成日志写明「跳过旧集 N 个（只收新增）」。③【兜底不变】缺 `DateCreated` / 解析失败 → 当新集收；整批无日期 → 退回整剧。④【前端】设置项标题改「整剧全收（包含旧集）」，说明写明「关（默认）：只入库本次新增的集 —— 你只加 3 集就只收这 3 集；开：该剧全部集入库」，并提示补旧集走「扫描」/「重新拉取」。新增回归 37/37（含用户场景：13 集里只加 3 集 → 默认只收 3 集 / 开整剧全收 → 13 集全收）；全套回归 775 项 0 失败。
# v4.6.91(补齐入口补上「探测库」+ 开关作用域护栏): 用户指出「还少了一个：探测库」。核对确认：**补齐整剧的三个入口都不走「整剧展开」那条链，因此都不受「只收新增」影响，一律全收补齐** ——①「扫描」（`_nfo_sync_worker` → `_record_nfo_library`）②「探测库」（`_run_probe_round`：按 Emby 清单找缺集 / 全新条目补齐）③「重新拉取」（`_api_db_rescan_item`：剧走 `find_nfo_files(剧目录, recursive)= tvshow.nfo + 全部单集 nfo）。`grep _series_ingest_all` 全插件仅 5 处（类属性 / 默认值 / 读配置 /导配置 / 整剧展开里那一次判断），其它入库路径一个都没读 → 作用域严格受限。①【前端文案】设置项说明补齐三个补收入口：「扫描」（全量/增量）、「探测库」（按 Emby 清单补齐缺集与全新条目）、对该剧「重新拉取」（按本地 nfo 重采集该条目全部集）。②【代码注释】整剧展开处同步写明「本开关仅影响本路径」+ 三个正确补齐入口。③【回归护栏】新增 5 项作用域断言：全插件仅 5 处引用、整剧展开里仅 1 次、`_run_probe_round` / `_api_db_rescan_item` / `_record_nfo_library` 均**不读取**该开关（防止将来误接导致补齐也变成「只收新增」）。新增回归 42/42；全套回归 780 项 0 失败。
# v4.6.92(整剧入库三条规则：通知数量对齐判定 + 兜底全收 —— 修「新入库整剧却一个都没收」): 用户实测：一次性入库「某剧」4 个季（Emby 通知「已添加了 4 项」、剧中 4 集），却因资源包自带旧时间戳被 v4.6.90 的时间判定当成「全旧集」→ **一个分集都没入库**（只入了 tvshow.nfo）。用户拍板三条规则：① 开了「整剧全收」→ 全收；② 没开：**通知数量 N ≥ 集总数 → 整剧都是新加的 → 全收**；③ 否则按加入时间只收新增；④ **一个都挑不出来 → 兜底全收**（宁可多收，绝不出现「新加了东西却一个没收」）。①【通知数量全链路】新增 `_parse_added_count()`：从 Emby 通知标题解析「已添加了 N 项」（中文 / 英文「N items added」/ dict 报文 / 裸字符串都支持；解析不到返回 0 = 无此信号，绝不当作 0 项）；handle_webhook 解析后存入调度队列（重复事件刷新、不覆盖为 0）→ `_webhook_worker` 取出 → 单条路径第 4 参 / 同剧聚合成员 dict → `_webhook_translate_worker` → `_submit_series_expand`（含线程池 / 独立线程 / 同步兜底三处透传）→ `_translate_series_expanded(added_count)`。②【决策抽成独立方法】新增 `_decide_series_ingest(eps, added_count)` —— 三条规则单点收口（开关 → 数量对齐 → 时间挑新增 → 兜底全收），返回「要入库的集 / 跳过数 / 判定说明」；`_translate_series_expanded` 只负责调用与打日志（判定说明直接进日志，用户可从日志看到走了哪条规则）。③【兜底语义】时间判定一个都没命中（全为旧时间/时间不可靠）→ 全收 —— 不再出现「整剧新入库却 0 集入库」；某剧式「只加了部分」场景不受影响（时间命中 3 集 → 仍只收 3 集）。④【不变式】补齐旧集入口（「扫描」/「探测库」/「重新拉取」）不走本判定、零影响；即使全被跳过也不早退 —— tvshow 仍入库。新增回归 47/47；全套回归 827 项 0 失败。
# v4.6.93(人名池「已是中文却显示🟡待同步」修复 —— 当前名未知不再判待同步): 用户实测：人名池里「阿澄 佳奈」「佐仓绫音」明明已是中文却挂🟡待同步，怀疑是「空格惹的祸」。核对运行库副本：这批行（共 12 行）全部是**扫描缓存行** —— `source=scan`、`server_id`/`emby_person_id` 为空（本地 NFO 扫描拿不到 Emby Person 身份）、`name_current` 为空（不知道 Emby 当前名）；带空格（阿澄 佳奈）与不带空格（佐仓绫音）表现完全一致 → **与空格无关**。旧口径把「当前名未知（空）」一律判待同步 → 11 行已中文缓存行常驻🟡待同步，还会进「批量同步」队列白跑改名。①【口径修正】同步维度只在「有东西可同步」时算待同步：Emby 当前名**已知**且 ≠ 目标名 → 待同步（含「原文已是中文 + 当前名不同」旧语义，保留）；当前名**未知**（空）→ 只有「有真译文」（`name_zh` 有效）才待同步（等待写回 Emby），原文已是中文（目标名 = 原文）显示「无需翻译」。`_SQL_SYNC_PENDING` 重写为「(当前名未知 AND 有真译文) OR (当前名已知且≠目标)」；`derive_pool_status` 同口径加分支（当前名未知 + no_change → sync=unknown）。②【前端镜像】`PeoplePoolView.vue` 的 `recomputeRowStatus` / `canSync` 同步修正；行内「同步」按钮桌面端改用 `canSync`（与移动端同口径）—— 已中文 + 当前名未知的行不再显示「同步」（要补 Emby 身份请点「重拉」或跑「拉取人名」）。③【验证】修复前/后对照（真实库副本）：恰好 11 行「待同步 → 无需翻译」，其余行零变化；「待同步」筛选/计数与仪表盘同步归零。新增回归 43/43（真实 SQLite + 12 行用户场景 + 前端 Node 行为级）；全套回归 875 项 0 失败。
# v4.6.94(人名池显示口径：译名列「改过才显示」+ 状态文案「无需操作」): 用户口径：①人名池的原文名/译名两列不再重复显示同一个名字 —— 原文名列只显示拉进来的原名；译名列只在「第一排改过」时显示最终译名（AI 翻译/人工修改），人工改错也能对照原文名修正；②原文本来就是中文 → 译名列不用显示（只显示一处）；③只要第一排改过，状态就与没改过的行不一样（待同步/已同步）。①【前端显示（PeoplePoolView.vue）】新增 `zhText()` 单点判定：`name_zh` 为空或与原文相同 → 译名列显示空占位（桌面「—」、移动「— / — 未译」），只有真改过（zh≠原文）才显示译名；筛选/搜索/编辑逻辑不变。②【状态文案】「无需翻译」→「无需操作」（这类行不翻也不同步，什么都不用做）：`db.derive_pool_status` 的 ui 输出、状态筛选 chip、状态徽标（绿🟩）、统计明细与批量翻译弹窗明细同步改名；SQL 计数键 `no_change` 与口径不变。③【验证】语义矩阵：未改过+已中文→无需操作 / 未改过+非中文→待翻译 / 改过→待同步（或已同步）——「改过状态就不一样」；AI 原样返回（zh==原文）不算改过。新增回归 37/37（前端 Node 行为级 + 真实 SQLite）；全套回归 912 项 0 失败。
# v4.6.95(汉字夹空格=已中文 / 条目显示名=剧名): 用户实测《某剧》：①「待翻译明细」第一排出现「名冢 佳织 / 村川 梨衣 / 新谷 良子 / 福圆 美里」等**已是中文却仍算待翻**的词条（同一批里「佐仓绫音 / 阿澄 佳奈」没空格所以被正确跳过 —— 反证问题出在空格）。根因：**汉字夹空格**口径不一致 —— `db.py` 早在 v4.6.80 就把「含汉字且无假名」判为「已是中文」（空格不再排除），但 `__init__.py` 的 `_name_is_zh` 仍把「汉字夹空格」是日文名要求翻译 → 白占人数上限、白调 LLM，还与人名池显示「无需操作」自相矛盾。另 `_tx_force_round`（重新翻译）漏过 `_skip_no_translate` → 实际重翻比弹窗预估多翻。②「待翻译明细」标题显示成某一**分集名**（《转学生来了》）而非**剧名**（《某剧》）。根因：同一 item_id 下剧级行 title=剧名、各集行 title=集名，SQL 用 `MAX(title)` 按字符序取最大 → 恰好选中集名（「转」U+8F6C > 「悠」「第」「吹」「上」）。①【口径对齐】`_name_is_zh` 改为「含汉字 且 不含假名」（空格不再排除，与 db.py v4.6.80 一致）；「汉字夹空格」识别方法 `_looks_like_spaced_cjk_name` 保留但不再参与翻译判定。繁/日文汉字名（如「名塚 佳織」）繁转简会变 → 仍照常翻译，不误伤繁→简。②【强制重翻补门禁】`_tx_force_round` 收词条时补 `not self._skip_no_translate(...)`，与「重新翻译」弹窗预估同口径（不再「预估显示不用翻、实际却送 LLM」）。③【条目显示名单点收口】新增 `_SQL_ITEM_TITLE` = 剧级行（非 Episode）title → series_name → MAX(title)，替换 `_pending_kind_sql`（含人数上限两分支，中间层透传 item_type/series_name）、`pending_items_list`、`find_pending_items` 的 `MAX(title)`。「待翻译明细」/徽章悬浮列表/写回候选清单的标题从此显示剧名。新增回归 36/36（真实 SQLite 两分支 + Node 无关，纯后端）；全套回归 948 项 0 失败。
# v4.6.96(同一人重复 credit 去重：<writer> + <credits>): 用户实测《某剧》S01E01：库页右侧「分集演员」里出现**两个「吉田玲子」**（无角色），但 Emby 只显示一个。核对源 nfo（`<媒体库>/测试/某剧/Season 01/S01E01.nfo` 第 46/47 行）发现同一个人被同时写在两个 credit 标签里：`<writer>吉田玲子</writer>` + `<credits>吉田玲子</credits>` → 插件按标签各采集一条 → 库里两行；Emby 按「人物」展示，所以只有一个。①【采集层去重】新增 `_dedup_credit_people()`：同一 nfo 内「原文名 + 角色」完全相同只保留先出现的一条（`_record_nfo_library` 落库前调用）→ 从源头不再产生重复行；因 `upsert_people` 是「删该文件旧行再插」，重扫/重新拉取即顺带清理历史重复。②【展示层去重】新增 `_dedup_credit_rows()`：`_api_db_people` 对「剧级名单 + 各集名单」按「name_before + role_before」去重 → 历史重复行**无需重扫**也立刻只显示一个（与 Emby 一致）；`people` 扁平列表不动，翻译/写回流程零影响。③【不误合】同名但**角色不同**（如一人分饰两角）仍保留两条；角色空白差异按 strip 归一。新增回归 25/25（真实 SQLite 集成 + 采集/展示两层）；全套回归 973 项 0 失败。
# v4.6.97(分集/主演员名单「按类型分段」—— 一眼分清演员与导演): 用户实测：库页右侧「分集演员」里所有人物平铺成一个样（只显示「名字 + 饰 角色」），看不出哪个是演员、哪个是导演/编剧 —— 实测 S01E01 里 川面真也（导演）、吉田玲子（编剧）与演员长得一模一样，只是没有「饰 …」。用户口径：分集显示「像电影一样」按类型分段；类型判断「除非 nfo 明确写客串，否则都算演员」（本就如此：类型取自 nfo —— `<actor>` 的 `<type>` 缺省/Actor=演员、显式 GuestStar=客串；`<director>`=导演、`<writer>`=编剧、`<credits>`=制片人）。①【新增 `groupByType()`】把名单按类型分组（顺序：演员→声优→客串→导演→编剧→制片人→其他未知类型按出现顺序追加）。②【两处接线】主演员区（computed `mainCastGroups`）与每个分集内部（`groupByType(ep.people)`）都按类型分段，段标题 = 「图标 + 类型名 + 数量」；**只有一种类型时不显示段标题**（避免「演员 12」这类冗余，单类型时观感与旧版一致）。③【样式】新增 `.epl-type-block` / `.epl-type-sub`（与电影页 `.epl-cast-title` 同款观感、更紧凑）；两栏卡片布局不变。④【纯前端】数据 / 翻译 / 写回全部不动，无需重扫。新增回归 25/25（Node 行为级 + 源码接线 + 用户场景）；全套回归 998 项 0 失败。
# v4.6.98(删除链路安全加固：审查报告 P1-01 ~ P1-04): 承接 v4.6.97 静态审查报告，落实 4 个「必须先修」项。①【P1-01 条目存在性三态】`emby_client` 新增 `_get_status()` / `fetch_item_status()`，把「查询失败」与「条目不存在」彻底分开：`FOUND`（2xx+JSON）/ `NOT_FOUND`（HTTP 404，Emby 明确回答不存在）/ `UNAVAILABLE`（超时、连接失败、400/401/403/500/502/503、响应非法 JSON、无 user_id、客户端不可用）。`_handle_webhook_delete` 的容器（Series/Season/Folder）存在性检查改用三态：FOUND → 容器仍在（按差集只标真正消失的集）；NOT_FOUND → 明确不存在（继续真删除标记）；**UNAVAILABLE → 状态未知：不整树标记、不发普通删除通知**，登记 ambiguous 事件（文案「删除状态无法确认…本次未修改翻译记录」）。此前 `fetch_item()` 把超时/401/500 一律返回 None → 与「条目不存在」同义 → 整剧批量误标观察期。`fetch_item()` 保留为兼容包装（拿不到即 None）。②【P1-02 强制 server scope】新增 `_resolve_unique_server_id()`：事件带 ServerId → 直接采用；未带但只配置 1 台 Emby → 用该台（唯一可确定）；未带且多台 / 无服务 → 拒绝（`server_id=None` 会退化成「不限定来源」= 全表范围，跨服务器误标）。删除处理在探测前先做该判定，无法唯一确定 → 不写库、不通知，登记 ambiguous/server_unknown。db.py 新增 `_require_scope()` 并对 `mark_deleted_by_nfo_path` / `mark_deleted_by_nfo_path_prefix` / `mark_deleted_episodes_by_prefix` / `mark_deleted_by_media` 增加 `allow_unscoped` 校验：`server_id=None` 默认**拒绝执行并告警**；本地维护线程（同一文件系统路径消失对所有来源成立）显式传 `allow_unscoped=True`。③【P1-03 清理计数异常中止】`_api_db_purge_missing()` 遇到 `count_missing()` 返回 -1 → 立即返回失败（「读取失效记录数量失败，已取消清理」），不删任何记录、不动事件列表；`purge_all_missing()` 实际删除 0 行 → 返回失败且**不清事件**，避免「一半成功一半失败」；删除行数与通知文案一致。④【P1-04 探测三态】`media_probe()` 新增 `status`：数据库查询失败返回 `status=error`（不再伪装成 managed=False），并在 docstring 说明；`_handle_webhook_delete` 遇 error → 不改记录、不发普通删除通知，登记 ambiguous；`_cleanup_dirty_webhook_events()` 遇 error → **保留事件**（只有「成功查询且确认无对应记录」才移除脏事件）。新增回归 test_v498（52 项：三态解析 13 + 唯一服务器 5 + 强制 scope 12 + probe error + 清理保留 + 端到端 A/B/C/D）；同步按新规范更新 v466/v476/v485 三个旧删除测试（显式 server scope；容器三态；新增「状态未知不按真删除处理」用例）；全套回归 1058 项 0 失败。
# v4.6.99(审查报告二轮：季集枚举完整性 / 服务器白名单 / 任务锁 / Snapshot / 清理结构化): 承接 v4.6.98 复审，落实 5 个 P1 + 1 个 P2。①【P1-01 季集枚举失败不再误标整季】`emby_client` 新增 `get_series_episodes_status()`（返回 `(status, items, reason)`）与 `query_items_status()`：区分「请求成功且**分页/总数完整**」「Emby 明确 404」「失败/不完整」（超时、401/403/500、无 user_id、响应非法、空页但总数未取尽、末页不足且总数更大）。`get_series_episodes()` / `query_items()` 保留为兼容包装。`_reconcile_missing_episodes()` 返回值由 2 元组改 **3 元组** `(缺失集, 枚举是否可信, 原因)`：查询失败 / 分页不完整 / 返回条目却解析不出季集号（结构异常）→ 一律**不可信**；`_handle_webhook_delete` 遇不可信 → **不再退化为「整季前缀标记」**（v4.6.86 的危险回退，会把仍存在的整季误标进观察期），而是登记「删除状态无法确认」待确认事件并安全退出。②【P1-02 非空 ServerId 必须经白名单校验】新增 `_configured_server_keys()`；`_resolve_unique_server_id()` 收紧：事件带的 ServerId **必须能映射到已配置服务**，否则判「服务器未知」（此前无法解析时原样返回，未知 GUID 会被当有效服务器）。新增 `_scope_sql_soft(server_id, include_legacy=True)` 与 4 个 mark_deleted_* 的 `include_legacy` 参数：**多服务器环境**下 legacy 空来源行归属不明 → 删除事件不再自动认领（`include_legacy=False`），单服务器保留 True。③【P1-04 任务锁】`_api_pool_refetch_one()` 补 `_task_busy_msg()`（此前只有 `_api_gate()`，直接请求 API 可绕过）。④【P1-05 服务器未知先只读探测】服务器无法唯一确定时，先做**只读**跨来源候选探测：查询成功且全库无候选 → **完全静默**（不再产生与插件无关的 UI 事件）；有候选 → ambiguous 待确认；探测失败 → 不当作 0 命中。⑤【P1-03 Job Snapshot 扩充】快照补 `version`（TX_SNAPSHOT_VERSION=2）+ `limits`（人数上限）/`tmdb_credits`/`tmdb_fill`/`auto_writeback`/`nfo_preview`/`batching`/`batch_size`/`libraries`/`servers`/`llm_model`；`_tx_limits_by_level()` 与 `_wb_writeback_enabled()` 任务期间改用快照（运行中改人数上限/写回策略不影响当前 Job）；`_api_save_config()` 运行中保存 → 明确提示「下个任务生效」（`data.applied_next_task`）。⑥【P2 清理结构化】`_cleanup_dirty_webhook_events()` 改为返回 `{success, removed_count, kept_error_count, error_message}`（探测 error 的事件保留并计数）；`_api_db_purge_missing()` 区分「无需清理 / 已清残留事件 / 事件状态无法确认（未执行强制清理，success=False）」，文案与实际结果一致。新增回归 test_v499 56 项；同步按新规范更新 v476/v484/v485/v498；全套回归 1122 项 0 失败。
# v4.6.100(恢复判定越界修复：剧级 tvshow.nfo 不再清扫整剧观察期): 用户实测「某剧」删 S02E01/S03E01（标记 19 行）→ 放回 2 集 → 整剧入库通知只写「已恢复被删条目 1 个」。核对运行库发现 19 行确实全部解除观察期、译文 39/39 保留（本次结果正确），但恢复路径越界：整剧入库的 nfo_items 首项是**剧级 tvshow.nfo**，它没有季集上下文（season/episode=None），而 `is_deleted_by_media(item_id=..., 季集=None)` 会退化成「匹配该剧**全部**观察期行」→ 剧级 NFO 一次性把 S2E1+S3E1 的 19 行全清（recovered 只记 1），随后 4 个单集 NFO 判定皆空。已用插件真实 db.py 在临时独立库复现：剧级身份判定命中 19 行、清除 19 行。**真实风险**：只删 1 集时，之后任何整剧入库（新增别的集 / 整剧扫描 / Webhook）都会把该集观察期静默清掉（实测复现：只标 S2E1 → 剧级身份判定命中 10 行 → 全清），与 v4.6.85「只标真正消失的集」完全不对称。①【修复】`_ingest_nfo_pending` 新增 `_sweep_ok = (lv == "movie") or (lv == "episode" and 季集非空)`：只有「电影单条目」或「带明确季集的单集」才做身份恢复清扫（强身份 `is_deleted_by_media` + 唯一候选弱匹配 `deleted_weak_candidates`）；**剧级 tvshow.nfo 只认 `is_deleted_by_nfo_path` 精确命中**（剧级行级，不会越界到同剧其它集），逐集恢复交回各自的单集 NFO。②【清除同步收窄】`clear_deleted_by_media` 与历史别名登记同受 `_sweep_ok` 守卫；`clear_deleted`（nfo_path 行级精确）不设限 → 剧级 NFO 仍能解除剧级行。③【计数修正】放回 2 集即报「已恢复被删条目 2 个」（与 v4.6.84「按 NFO 文件数」口径一致）；只删 1 集时不再误报恢复。④【别名去重键】`alias_put` 去重键补 `old_nfo_path` —— 同剧不同集共享剧级 media_id 且被删行 emby_item_id 为空，键完全相同导致后写覆盖先写（实测两集只剩 S03E01 一条别名）→ 现在每集各留一条旧身份。新增回归 test_v4100（23 项：源码门槛 + 剧级越界可复现 + 单集精确恢复 + 计数 2 + 只删 1 集不误清 + 别名各留一条）。
# v4.6.101(「待翻译明细」弹窗列表可滚动): 用户反馈「翻译明细一多就占很大一块，希望加滑块」。库页「待翻译明细」弹窗此前把全部条目平铺在 v-card-text 里，条目多时弹窗高度无限增长（撑出屏幕、要滚整个页面）。现在把「空态 + 条目列表」包进 `.epl-pend-scroll` 容器：`max-height: 56vh; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px;` —— 列表超过约 56% 视口高度即出现滚动条（滚动到底不会带动外层页面），弹窗头部（标题 + 统计说明）与底部「关闭」按钮始终可见。纯前端样式/结构改动，无数据与逻辑变更，无需重扫。全套回归 1145 项 0 失败。
# v4.6.102(翻译吞吐三处 P0 缺陷修复 —— 批大小不再被钉死为 1 / 每批独立重试 / 译名==原名视为无需翻译): 用户线上日志实测：一次 14936 条词条的翻译任务，781 次 LLM 请求里 66% 的批大小是 1（吞吐 0.143 条/秒 vs 30 条/批的 1.97 条/秒，差 13.8 倍），6 个 job 完成 0 条，且「M」「Blofeld」等词条每轮开局必撞、永不完成。逐条独立复核日志后定位三处源码缺陷并修复：①【P0·批大小被永久钉死】部分返回时的旧逻辑 `_size = min(_size, len(_missing))` 且 `self._tx_batch = _size` —— 「29/30 部分返回」时 min(30,1)=1，把批大小钉死为 1；`_tx_batch` 又是实例属性、**job 之间从不重置**，直到插件重启才恢复。现在部分返回**只重试缺失项、绝不改动批大小**（`_size` / `self._tx_batch` 均不动），缺失项排到队尾（不再永远堵在队首形成毒丸闭环）。②【P0·整个 job 只有 1 次缩批重试】`_partial_round = 0` 定义在 while 之外 → 第一批用掉唯一一次重试机会后，其余批次的缺失项全部直接记失败；改为 `_partial_round` **每批独立**（移入 while 内重置）。③【P0·毒丸词条永远 pending】「译名 == 原名」此前被 `_v != _txt[_id]` 判为「模型未返回」→ 触发缩批重试 → 二次仍缺 → 记失败 → 回队首 → 每轮开局就撞（实测「M」「Blofeld」「James Bond」这类单字母名 / 专有名词）。现在视为**无需翻译**（noop）：计入本轮完成、写入会话级 `_tx_noop_terms` 集合，本会话不再重发；另新增 `_tx_untranslatable()` —— 单字符 / 无字母的词条直接登记为无需翻译，省掉一次 AI 请求 + 一次重试也不占单批名额。④【批大小恢复补丁】去掉旧的 `len(_pending) >= _size` 条件（缩批路径下 `_pending` 已被改写，该条件在最后一批恒为假 → 批大小永远爬不回上限）；本批「无缺失」即向上爬升（上限 = 设置页「单批最多翻译条数」）。noop 的生命周期与既有「失败跳过」一致：终止任务 / 改设置即清空。新增回归 test_v4102（36 项：源码级 11 + 批大小不钉死 + 毒丸排到队尾 + 每批独立重试 + 三缺陷混合批各归其位 + 单字符判定）；全套回归 1181 项 0 失败。
# v4.6.103(库页左栏永久转圈 / 「任务统计」迟迟不出来 + TMDB 404 刷屏): 用户实测（库内 360 条目）「每次打开库左侧都转半天……明明已经显示出来了，但依旧还在加载，加载完又不见，又加载，就没停过」，且日志 1 秒 1 条 "The resource you requested could not be found."。①【库页转圈·前端 LIB-004】`loadItems` 有「请求代次」但缺单飞守卫：轮询每 8s 一次，`/db/items` 一旦慢于 8s，老请求被新请求顶掉（seq 不匹配 → early return，finally 不清 `loadingList`），新请求又被下一轮顶掉 —— 永远没有「最新一代」请求，`loadingList` 恒为 true（条目照常渲染 → 正是「已显示却一直转」）。现照搬 `loadTxPreview` 的 `_txPreviewInflight` 加单飞守卫：在飞期间丢弃本轮调用（手动刷新仍即时给出 loading 反馈），保证在飞的唯一请求一定是最新一代、其 finally 必然收尾。②【任务统计·后端减负 LIB-005】`/db/translate_preview` 每轮把同一份重快照算两遍（`_pending_stats()` + `_tx_pending_snapshot(with_detail=True)`，各含 pending_terms_full + count_pool_status）→ 改为一次 `_tx_pending_snapshot(with_detail=True)`，徽章数与悬浮明细**同源复用**（新增 `_pending_stats(snap)` 可选入参）。③【库列表·后端减负 LIB-005】`_annotate_db_items` 每次 `/db/items` 都跑全表 `CAST(deleted_at AS REAL)` 扫描 + DELETE（`expired_item_ids` / `purge_expired`）→ 限频 **120s**（内存时间戳；宽限期以小时计，粒度绰绰有余）。④【TMDB-4 404 根因】`_record_nfo_library` 里单集记录拿不到剧级 id 时**退回用单集 id 当剧 id** 请求 `/tv/{id}/credits`，必然 404（每个单集文件 1 条日志）→ 此类直接放弃补角色，不再发无效请求。⑤【TMDB-1/2 负缓存】宿主 `TmdbApi.get_tv_credits/get_movie_credits/get_person_detail` 对 404/异常一律**吞掉返回空**，插件无法区分「确实没有」与「请求失败」，且 `_tmdb_credits_cache` 每轮扫描清空 → 同一个坏 ID 被反复重打；现加**进程级负缓存** `_tmdb_dead`（`("credits", 键)` / `("person", TmdbId)`），TTL 6 小时（过期自动重试，网络抖动不会永久毒化）；「清空缓存」会一并重置。⑥【TMDB-3】`_tmdb_poster_url` 无图/失败同样落缓存（空串）→ 不再每次打开详情都重打 TMDB。新增回归 test_v4103（45 项：Node 行为级单飞 + 快照复用 + 限频 + 负缓存 TTL + 单集不再发无效请求）；全套回归 41 文件 0 失败。
# v4.6.104(库页左侧「每次刷新都拉一下」/「分库刷新了又退、又没有」+ 改为有更新才刷新): 用户实测（库内 360 条目、4 个分库）「每 8 秒刷新一次，刷新完就一直停到第一个库，另外几个刷新了又退、刷新了又没有」，并诉求「如果有数据更新的话再刷新，没数据更新干嘛要刷新」。①【根因·分页窗口被丢弃 LIB-006/007】`loadItems` 固定 `limit=100&offset=0` 且无条件 `items.value = list` —— 用户滚动加载出来的后续 260 条每 8s 被整段丢弃、列表塌回第 1 页；而左侧分库分组按条数排序，落在第 1 页之外的分库（服务器1·电视剧 / 服务器1·电影）整组消失，底部哨兵又把它们补回来 → 「刷新 → 塌陷 → 重新加载」每 8s 循环。现 **①按当前窗口大小请求**（`limit = max(100, items.length)`，手动刷新同样不再丢用户滚出来的分页）**②按 key 原地合并**（同键条目保留对象引用、只改字段、顺序不变；新键追加）—— 引用不变则 Vue 不重建 DOM，滚动位置与展开状态稳住。③【窗口不完整不得删条目 LIB-010】用户二次实测「第一次进去没事、待久了才有问题」。列表按 `translated_at DESC` 排序，翻译一发生顺序就变，上一窗口里的条目会落到新窗口之外；`_mergeItems` 若无条件按本次响应裁剪，就会把已加载条目删掉 → 分库整组消失、哨兵再补回，形成无限抖动。现由 `_complete = list.length >= total` 判定「本次是否已覆盖服务端全部条目」，**只有拉全时才允许移除**，否则只做「改字段 + 追加」。④【等价跳过 LIB-006】新增 `_itemSig/_itemsSame`：按左栏真正渲染的字段（title/item_type/library_name/deleted_at/deleted_eps/person_count/episode_count）+ 复合键比对，内容等价则**整段跳过赋值**（连 computed 都不触发），hasMore 仍同步。⑤【有更新才刷新 LIB-009】`db.py` 新增进程级库数据版本号 `db_rev()`：仅在**写入 person 表**时自增（`_x()` 判 SQL 含 person + `upsert_people` 批量写路径；翻译任务/批次等簿记写入不参与，避免刷屏）；`/status` 下发 `items_rev`，前端 8s 状态轮询里比对版本号，**只有变了才 `loadItems(true)`** —— 没写库就一个字节都不重拉。删除按固定周期拉列表的 `listTimer`；列表改为事件驱动：版本号变化 / 任务结束跳变 / 用户操作 / 切回前台。⑥【后台不轮询 LIB-008】`document.hidden` 时跳过轮询，`visibilitychange` 切回前台立即补一次。新增回归 test_v4104（43 项：Node 行为级合并/等价跳过/窗口保持 300 条不塌陷/不完整窗口不删条目 + 版本号驱动 + 真 SQLite 版本号自增口径）；test_v4103 同步更新单飞与计时器断言；test_p2_ui008_009 同步更新首页分页请求断言。全套回归 42 文件 0 失败。
# v4.6.105(人名池「批量翻译」一轮 0 条 —— 池句柄未初始化 LIB-011): 用户实测：人名池卡片「待翻译 89 个 / 无需操作 3668 个」，点「批量翻译」后日志 `job=... source=pool scope=both items=303 terms=1960 收到翻译许可` → `本轮无可消费词条：来源=pool 范围=both｜…｜池=False（池未收：源不含 pool / 未开池翻译 / 范围不含第一排）` → `PARTIAL 完成 0 / 剩余 1960（人名 59 / 角色 1812 / 池 89）`，池里 pending 一直不动。根因：`init_plugin` 只建了 `_people_db`，**没有建 `_name_map_db`** —— 该属性一直为 None，要等「扫描 / 拉取人名 / 重拉 / 同步」等路径惰性赋值（那些地方都写 `getattr(self, "_name_map_db", None) or NameMapDb()`）；而翻译 worker 收池词条用的是 `nm = getattr(self, "_name_map_db", None)`（**无兜底**），池收集门 `nm is not None` 直接失败 → 池行一条都收不到（池页/统计正常，是因为它们走 `or NameMapDb()`；池翻译入口 `_api_pool_translate` 也只校验「范围含第一排 + 第一排总开关」，不校验池句柄，于是任务照常启动、一轮 0 条）。修复：①`init_plugin` **启动即建人名池句柄**（与 `_people_db` 同点，放在 `NameMapDb.ensure_table()` 之后）；②worker 收词前**兜底**：`nm is None` 时就地补建并挂回 `self`，只告警一次（`name_map_db_lazy`），保证门一定能拿到句柄；③「本轮无可消费词条」诊断**按具体一条原因**输出（来源不含 pool / 池翻译总开关已关 / 范围不含第一排 / 池句柄未初始化），不再并列三种可能。新增回归 test_v4105（23 项：源码级 init_plugin 建句柄·兜底位置·诊断原因 + 真 SQLite 池数据侧 + 逐字执行源码兜底片段）；全套回归 43 文件 0 失败。
