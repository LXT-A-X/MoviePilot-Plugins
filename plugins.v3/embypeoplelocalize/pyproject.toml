[project]
name = "moviepilot-embypeoplelocalize"
# v4.6.21(P3-14/§九): 版本与 __init__.py 的 plugin_version 对齐（此前停留在 4.6.7）
# v4.6.22(P1-D): writeback_state 唯一约束 + 原子 upsert（去重迁移 v7）
# v4.6.23(UI): 「库」页刷新按钮移至顶栏右侧（与条目统计同组右对齐）
# v4.6.25(UI): 修复构建过滤器误删自有覆盖样式（开关对齐/停用屏蔽生效）；停用遮罩调暗，横幅右移避让关闭按钮
# v4.6.26(UI/后端): 设置页归类重排（思考与请求/翻译分批移入 LLM 设置）；库页「写入」改名+提示、编辑译文加「同步到 Emby」；人名池「编辑人名」改勾选框；写回两排均落 NFO（第一排再同步 Emby）；扫描分两排体检+通知汇总；第二排无原文角色名仅统计跳过 AI
# v4.6.28(P0/数据一致性): NFO 断点改带文件签名（断点后改动必重扫，NFO-001）；入库失败不再计入断点且自动重试（NFO-002）；文件签名升级纳秒级并兼容旧签名表（NFO-003）；断点按处理顺序截断（NFO-004）
# v4.6.29(P0/P1 数据一致性): DB-001 媒体身份带来源作用域（读取/标记观察期/删除/集数统计/库分组全部按来源，不再跨来源误伤同 item_id 记录）；WH-001 webhook 重试计数改 server:item 复合键；WB-002 失败条目不再等 pending 清空才重试；WB-003 writing 超时租约自愈
# v4.6.30(NFO 语义 + 前端): NFO-009 支持 UTF-16（读得进、写回保留原编码；GBK 等无 BOM 明确拒绝不再乱码）；NFO-008 按 XML 根节点识别非影视 NFO（音乐/图片等不采集不入库，计入断点不重扫）；SEC-001 /config 不下发 LLM Key 原文（掩码 + 显式清除）；前端：状态灯显示真实任务、清空日志/事件加确认、去掉 30 秒假 busy、请求代次防旧响应覆盖、条目/集改来源复合键、写回按钮绑任务态
# v4.6.31(UI-004/006/007 + SEC-002): 探测库使用独立 probe_status（不再污染 _scan_status，scan 状态灯只反映扫描）；PeoplePool 明细 key 增加 server_id 维度（跨服务器同名人物展开/详情不再互串），occurrence 按来源查询；PeoplePool 导入 JSON 增加大小(30MB)/行数(50000)上限，后端兜底 50000 行；依赖追加经验证的上限（大版本锁）+ constraints.txt 锁 + CI（编译/测试/构建）
# v4.6.32(P2/P3 + 结构整改): UI-008 库页选中项失效判断改用来源复合键（itemKey）；UI-009 人名池汇总分组 key 改用「原文+角色」（仅译名冲突不再串行）；库列表 /db/items 增量分页（后端 limit/offset，前端无限滚动 + 复合键去重 + 请求代次守卫，limit=0 保持旧数组返回兼容）；结构：抽取 task_manager.py（运行/暂停/停止状态机 + 统一启动器）与 path_utils.py（段安全路径工具）为 mixin，行为逐字不变
# v4.6.33(P1 内存): 库列表分页内存修复 —— 新增 PeopleDb.library_items_page，/db/items 的 limit>0 改走 SQL 层 GROUP BY (server_id,item_id) 聚合分页（按 updated_at=MAX(translated_at) 倒序、纯 Episode 组在 HAVING 剔除），只加载当前页行，字段/排序与整表路径逐字一致；limit=0 仍走整表+缓存+数组（向后兼容）；抽取 _group_person_rows/_scan_scope_sql/_annotate_db_items 共用实现
# v4.6.34(P1 分页正确性 + 大库性能): 分页分组键与 _group_person_rows 归一化对齐 —— GROUP BY 改 COALESCE(server_id,''),COALESCE(item_id,'')，修 NULL 与空串被 SQL 拆成两组、又不被 Python 合并所致的页内重复项与 total 虚高（含 item_id 为 NULL 的兜底 IN/IS NULL）；新增表达式索引 idx_person_page(plugin_id, COALESCE(server_id,''), COALESCE(item_id,'')) 让大库分页聚合走索引、免全表临时排序；回归新增 NULL/空串与 2000 条目大库一致性用例
# v4.6.35(死代码清理): 依据 pyflakes 复核清掉不影响行为的冗余项 —— 移除未使用导入（LLMServerError/EmptyResponseError、两处 nfo_engine、mp_logger、PeopleDb）与死变量（_force/_pool/_fresh/do_backup/do_episode_sync/overwrite/person_pairs/role_pairs/only_roles/files_write/changed/trans_types/_doc_title/_doc_year/skey、nfo.director_count/writer_count、emby_client.time），无占位符 f-string 降级为普通字符串；能力探测型导入（httpx/openai/socksio/socks/zhconv）保留
# v4.6.36(依赖修复): openai 上限 <2.0 → <3.0 —— 宿主 MoviePilot 主程序锁 openai~=2.41.1，插件原约束与其冲突导致 UV 依赖预检拒绝安装；已核对代码仅用 v1/v2 共有稳定 API（OpenAI(...)/chat.completions.create(max_tokens=,extra_body=)/.choices[0].message/close()），与 2.41.1 源码兼容
# v4.6.37(UI): 关闭「AI 翻译（LLM）」总开关时，其余依赖 AI 的开关/输入实时变为不可选中（含人名池翻译、Webhook 自动翻译、翻译范围各开关与人数上限、测试连接），基于 computed 实时生效、无需保存、再次开启立即恢复
# v4.6.38(UI 统计): 库页顶部新增常驻「待翻译统计」徽标（按条目维度）—— 复用人名/角色待翻口径，SQL 聚合出「还有多少个条目未翻完」，>0 时高亮显示「有任务 · 待翻译 N 个」、=0 显示「无待翻译」，点击直达「全部翻译」；随 8s 轮询静默刷新，新增 db.pending_items_count 与 /db/translate_preview 的 items_pending 字段
# v4.6.39(UI 微调): 「待翻译统计」徽标改为纯展示（去掉点击直达「全部翻译」与手型光标），悬浮提示不再提示点击
# v4.6.40(设置项拆分): 「入库后自动开始翻译」从「Webhook 入库」卡片拆分并上移 —— 基础设置新增两个独立开关「Webhook 入库后自动翻译」(auto_translate_webhook) 与「扫描 / 探测库入库后自动翻译」(auto_translate_scan)；新增后端触发 _scan_ingest_trigger，扫描（含全库扫描）与探测库入库后按该开关决定授予翻译许可或仅唤醒 worker
# v4.6.41(通知准确性): 扫描完成通知/日志不再在未开启「扫描/探测库入库后自动翻译」时谎称「已交后台翻译 worker」（按 _scan_ingest_trigger 真实结果分支输出）；待翻数字改用库内 DB 口径 _pending_stats（条目 + 词条，与库页角标 pending_items_count 同源），弃用采集到的全部词条数，消除「通知 552 vs 角标 38」的维度错乱
# v4.6.42(库页单条重扫): 库页「写入」旁新增「重新拉取」—— 只按本地 NFO 重采集当前这一条（剧 = tvshow.nfo + 全部单集，电影/单集 = 单文件），刷新原文/层级/人数并保留该条已有译文，不翻译、不写文件、不触发整库扫描；后端新增 /db/rescan_item 复用 _record_nfo_library 单文件采集路径，与扫描同口径但不影响全库
# v4.6.43(量词文案): 翻译完成通知与翻译 worker 轮次日志里的「LLM N 次」改为「LLM N 条」—— 该数字是经 LLM 翻译的词条数（与同行「池/繁简命中 N 条」同口径），并非 LLM 请求次数，纯文案修正、无逻辑变更
# v4.6.44(采集口径拆分 + 人名池入库): 库页 PeopleDb 改为「文件里有什么就全量入库」（采集不再受类型开关/人数上限裁剪，完整展示）；新增 NameMapDb.add_pool_candidates —— 扫描/Webhook/探测库/单条重扫等所有入库路径按「翻译类型开关 + 人数上限（每作品前 N）」把对应类型人名写入人名池（无 emby_person_id 缓存行、允许空译文=待翻译，按原文去重、类型并集、译文只增不降级）；翻译阶段继续受「类型 + 人数上限」约束，且人名池既有行也按当前类型开关即时过滤（_pool_type_ok）
# v4.6.45(拉取类型跟随翻译范围): 移除人名池独立的「拉取类型」白名单（设置页卡片 + 拉取弹窗 chips + pool_fetch_types 配置项）—— 人名池拉取改为直接跟随设置页「翻译范围」的人名类型开关（新增 _pool_fetch_trans_types：需「第一排人名」总开关 + 对应类型开关开启，只看类型开关、不受人数上限约束）；「按当前设置重筛池」同口径；配置仅保留 pool_fetch_scope（拉取来源）
# v4.6.46(统一整改 i1–i6): 库页「重新翻译」改为条目级限定（_tx_scope_items，只重翻当前条目、不再扫全库，i1）；「翻译人数上限」按 doc 层级真正约束库内待翻词条（电影/剧集分别生效，_tx_limits_by_level，i2）；人名池同名人物按 server_id+emby_person_id 身份同步（原名多同名不再误阻止改名、legacy 行自动回填 server_id，i3）；扫描/拉取采集顺序改为「类型先于人名」并归位严格过滤（消除顺序依赖，i4）；「挂起 N」两处统计口径统一 —— pending_count 归为「待配置」（与 /webhook/pending 一致），新增 held_count（等待/重试调度 + 待配置合计，关闭 Webhook 冻结展示）与 scheduled_count，仪表盘状态芯片与关闭提示文案同步区分「待配置 / 挂起」（i5）；legacy/no-server-id 日志去重（_warn_once，仅首次提示，i6）
# v4.6.47(库页徽章整改 + 文案修正): 移除库页顶栏「共 N 个条目」（总条目数与徽章口径混淆、窄屏把徽章挤到第二排），顶栏只保留「有任务 · 待翻译 N 个 / 无待翻译」；徽章悬浮提示新增待翻条目标题列表（/db/translate_preview 新增 pending_items，与徽章同口径去重取标题、超 8 条截断显示「等共 N 个」），可直接定位「到底是哪个」；设置页「拉取类型」两处说明「跟随上方『翻译范围』」更正为「跟随下方」（翻译范围卡片实际位于人名池卡片下方）
# v4.6.48(重新翻译口径 + 人名池 + 日文名判定 + 出现清单): ①「重新翻译」改为与「全部翻译」同口径并弹窗选范围（第一排/第二排/两排）—— 按「类型开关 + 人数上限（每文件前 N 个）」取词，不再把该条目全部人名/角色都翻一遍（i2 收口）；②人名池「入池」只受类型开关约束、不再受人数上限约束（扫描 / Webhook / 探测库入库与拉取人名同口径），人数上限只作用于「翻译」（填 0 = 不翻该类型；池路径用粗粒度门 _tx_type_limit_on 与库内精确 SQL 同语义）；③人名池每行新增「重拉」按钮 —— 按身份从 Emby 重取当前名 / 类型，legacy 无 ID 行顺带补 Person ID；④修日文名判定：汉字夹空格的日文名（「日高 里菜」）不再被判成「已是中文 / 无需翻译」，TMDB 中文名候选同口径；⑤「出现的地方」跨来源兜底 —— 按 Emby 服务器查不到时回退不限来源再查，修「先扫描再拉池 → 查不到出现位置」
# v4.6.49(翻译范围三段式大改 + 类型/人数对两排生效): ①「翻译范围」重构为三段式 —— ① 翻哪排（第一排人名 / 第二排角色名，两个开关）；② 翻哪些类型 + 每个文件翻几个（一套，两排共用）：每行 = ☑开关 + 数字框，开关决定翻不翻该类型、数字 = 每文件每类型前 N 个、**0 或留空 = 不限**；去掉原「电影 / 剧套 / 单集」三套人数表格（合并为一套，旧三套取最大值迁移，带 limits_unified 标记只迁一次）；② 后端「类型 + 人数」同时对第二排角色名生效（此前角色名不受类型/人数约束）—— pending_terms 角色词条改为返回 (角色, 类型) 并按同一套类型开关 + 每文件前 N 个过滤，翻译 worker / 库内全部翻译 / 重新翻译 / 写回就绪 / 角标统计全部统一口径；③「重新翻译」弹窗改为「排选择（一次性任务）+ 只读预估」，明确「翻哪排」是本次决定、「类型 + 人数」由设置页决定；④人名池「拉取类型」恢复为**独立配置**（pool_fetch_types，不跟随翻译范围；默认演员 + 声优），设置页提供 ☑ 演员/声优/客串/导演/编剧/制片；⑤修人名池「重拉」按钮被操作列宽度挤掉（132→176px + 允许换行）
# v4.6.50(人名池列宽重排): 人名池表格在**总宽不变**的前提下重排内部列宽 —— 类型 72→58 / 状态 108→88 / 出现 68→54 / 操作 132→**170px**（固定列合计 380→370px），把「操作」让出来，使「改 / 同步 / 重拉」三个按钮一排放得下（此前第 3 个「重拉」被列宽裁掉看不到）；行内边距 8→5px、列间距 8→6px、操作列单行右对齐（不再换行）；窄屏（≤820px）同步调整：操作 118→150px。仅前端布局，无逻辑变更
# v4.6.51(人名池列宽二次调整 · 消除大块空白): 6 列由「2 个弹性列 + 4 个固定列」改为**全部弹性比例**（minmax + fr）均匀铺开 —— 此前原文名/译名两列吃掉全部剩余宽度、中间与操作列右侧各堆出一大块空白；操作列内容改为撑满列宽（justify-self: stretch）并靠右贴齐，按钮右侧不再留空；行内边距/列间距微调（5px 14px / 8px）。仅前端布局，无逻辑变更
# v4.6.52(表头对齐 + 拉取类型精简 + 徽章移位): ①人名池表头「状态 / 出现 / 操作」三列改为**表头与内容同时居中** —— 徽标与按钮自带内边距，只有居中才能让表头文字与内容精确对齐（类型列维持左对齐）；②人名池「拉取类型」去掉单独的「声优」项 —— 合并为「演员（含声优）」：勾选 Actor 即自动展开为 Actor + VoiceActor（Emby 把声优单列），存储里不再保留 VoiceActor，历史配置自动清理；③库页顶栏「待翻译统计」徽章从最右移到「清空」按钮右侧。仅前端布局 + 配置归一，无翻译逻辑变更
# v4.6.53(预估口径对齐 + 待翻译明细 + 编辑译文可恢复): ①「翻译范围」弹窗预估与实际口径对齐 —— /db/translate_preview 新增「符合范围」计数（names_scope/roles_scope，only_pending=False），弹窗按「本次选的排 + 设置页总开关」给出「待翻 X / 范围内 Y」，并为 0 的情况给出原因提示（该排总开关没开 / 类型开关没开 / 人数上限挡下），修此前「预估 0 但重新翻译有 10 个」的口径错乱；②「全部翻译」失败提示改为给出未翻人名条数 + 明确指引（去设置页调类型开关 / 人数上限）；③新增「待翻译明细」—— 库页「有任务 · 待翻译」徽章可点击，弹出按条目列出待翻的人名 / 角色词条（新接口 /db/pending_detail）；④「编辑译文」支持「改回与原文相同 / 留空」= 清除错译、恢复原文 —— 前端改用「打开弹窗时的现有值」比较（name_after0/role_after0）+ name_force/role_force，后端接受该等值写入并跳过 Emby 改名同步（此前被当成「没有需要修改的内容」拒绝）；⑤库页顶栏「刷新」按钮移除。仅前端 + 接口口径，无翻译逻辑变更
# v4.6.54(第二排不受人数上限 + 原文已是中文=无需翻译): ①**第二排角色名不再受「人数上限」约束** —— 角色名本就是「每人一条」，用第一排的人头上限去卡它会把第二排一起卡死（症状：演员人数=1 时，只翻第二排也只会取第 1 个角色，前几个已翻就变成「0 个待翻」并报「超出人数上限」，且调大也没用）；现在角色名只受类型开关约束（只勾演员 → 只翻演员的角色名），数目不限；②**原文已是简体中文 = 无需翻译** —— 新增 _skip_no_translate（含汉字、无假名/空格、繁转简后不变）从待翻口径 / 预估 / 待翻译明细 / 翻译取词 / 写回就绪判定中排除，中文名不再一直显示「待翻译」、不再白占额度、不再白调 LLM 或阻塞写回（繁体名仍保留待翻，不破坏繁→简）；③设置页「翻译范围」文案同步（数字只作用于第一排人名）
# v4.6.55(人数上限口径定型 + 提示精确化): ①**回滚 v4.6.54 的「第二排不受人数上限」** —— 人数上限按「人」计数、两排共用：只翻第二排时「演员=3」= 取前 3 个演员的**角色名**；且 N 只在「待翻」里数（已翻完的不占名额），只要还有待翻的就能翻到人；②「全部翻译」在「无待翻」时的提示改为三种情况精确判定 —— 真被人数上限挡下（列出当前各类型数字）/ 被类型开关关闭（列出已关类型）/ 真的全翻完；此前会把**关掉的导演·编剧**算进「仍有未翻译人名」而误导（你遇到的正是这种）；③新增「原文已是简体中文 = 无需翻译」（_skip_no_translate）；④设置页文案同步（数字按「人」计、两排共用、只数待翻）
# v4.6.56(关键修复：类型开关一关，待翻就恒为空): v4.6.53 起把 disabled_types 以「含 ? 的 SQL 片段」传给 _pending_kind_sql、却没把对应参数一起带上 → **只要有任何一个类型开关是关的**，SQL 就报「bindings 数量不符」→ 被 except 吞掉 → pending_terms 恒返回空 → 预估恒 0/0、全部翻译 / 重新翻译**一个人都取不到**（用户「导演 / 编剧关着」正好命中，所以调人数上限永远没用）；改为由 _pending_kind_sql 自己拼条件 + 参数（disabled_types 直接传入）。已用真实 NFO（某剧 10 位演员）建库实测：演员=3 → 3 个角色名、演员=1 → 1 个、演员=0(不限) → 全部；前 2 位已翻时仍取满 3 个（已翻完的不占名额）
# v4.6.57(预估口径统一 · 明细与合计一致): ①**「范围内」不再套「已是简体中文跳过」** —— 「待翻」= 真正需要翻的（排除已是简体中文），「范围内」= 符合类型+人数的全部；此前两者都套了跳过，导致第一排显示「范围内 0」而「重新翻译」显示 3，两边对不上（用户场景：10 位汉字名演员，待翻 0 / 范围内应为 3）；②「待翻译明细」列表改用 force_item_terms（带「每文件每类型前 N 个」人数上限）再过滤，与上方合计**同口径** —— 此前用 pending_terms_of_item（无上限），出现「列表 10 条、合计 3 条」的自相矛盾；③弹窗文案去掉绝对化措辞：范围内 0 时改为「可能是…，请到设置页确认」，待翻 0 且范围内 >0 时改为「已翻完 / 原文已是中文，无需翻译」
# v4.6.58(人名池改译名 → 同步回写「库」第一排): 人名池「编辑人名」此前只写池（name_map）、没回写库（person）→ 库页第一排停在旧译名、两边不一致；现 /pool/update 在写入池后按「全库同名」同步 person 表的 name_after（留空 = 恢复原文），并作废库列表缓存让库页立即刷新。至此「库 ↔ 人名池」双向同步闭环（库改 → 池 manual；池改 → 库全库同名）
# v4.6.59(「只翻第二排」被整体拦死 + 池中文名显示 ---): ①新增 _tx_role_type_enabled —— 角色词条此前复用 _tx_type_enabled，而它内部要求「目标范围含第一排」(_tx_scope_allows("person"))，用户选「只翻第二排角色」时所有角色词条被整体判 False → 统计 0/0、点击后提示「当前翻译目标下没有待翻译词条」（但预估明明显示待翻 3 个）；现角色走角色版判定（只看「含第二排 + 角色总开关 + 类型开关」，不要求含第一排），同步替换 worker 收词 / 待翻译明细 / 弹窗预估 / 全部翻译统计 / 单条重新翻译 共 5 处；②提示语 label 改用本次 _scope（此前先复位成 both 再取 label，选「只翻第二排」却显示「第一排人名 + 第二排角色」）；③人名池扫描入池时，原文已是中文（如「上坂堇」）直接落 name_zh=原文 → 译名列显示「上坂堇」而非「---」（与「拉取人名」路径一致；假名/汉字夹空格的日文名仍显示待翻译）
# v4.6.60(审查报告整改 · 数据正确 + 请求正确): ①【P0-1】LLM 错误分类重写 —— 限流证据（rate_limit_error/tpm/rpm/too many requests）优先于歧义 token insufficient_quota，只有明确账单证据（billing/credit/balance/欠费/余额）才判 quota_exceeded；429 一律按限流走短退避（Retry-After），不再被误判「余额不足」硬停 30 分钟；②【P0-2】条目级重翻精确写库 —— 新增 db.update_role_in_item，配合 update_person_by_name_in_item 按 item_id/server_id 更新，废弃全局 update_role_by_before/update_by_name（此前重翻 A 作品会连带改掉其它作品同名角色，且那些条目未登记写回 → 库/NFO 不一致）；③【P0-3】新增 _tx_pending_snapshot 统一待翻口径（库内人名 + 角色 + 人名池，按范围/类型开关/人数上限/已是中文跳过）—— 修 worker 开始统计 len(dict) 恒为 2 的 bug、修结束日志只查池 pending 导致「日志剩 0 / 库页还有 3」；④【P0-5】LLM 部分返回只确认已返回词条 —— 缺失项缩批重试一次，仍缺则记失败留 DB（此前无条件跳过整批，模型返回 2/3 时第 3 条被跳过且可能当成功结束 Job）；⑤【P0-4】轻量 Job 化：每轮任务一个 job_id，日志 [TranslateJob] job=… 输出，结束日志含 完成/失败/剩余（人名·角色·池）/ AI 真实请求次数（成功·限流·配额）/ 耗时；⑥【P1-1】待翻译明细弹窗随 8 秒轮询实时刷新（此前只在打开时拉一次，翻译完成后仍显示旧数据）；⑦【P1-3】llm_client 新增真实请求计数（stat_requests/success/failed/rate_limited/quota），与「词条数」分开；⑧【P1-4】「翻译分批模式」真正生效 —— per_title（默认）按作品分组并带上作品名上下文（新增 db.term_titles 映射），global 跨作品合并一次请求（此前该设置只读写不执行，且聚合时 title 恒为空）；max_people_per_batch 经 _tx_batch_max → _batch 参与批次切分（已核实真实生效）。模拟测试 10/10 通过（429 限流分类 7 例 + 条目级精确写库 + 作品上下文 + 统一待翻口径）
# v4.6.61(审查报告架构级整改 · 第 4~5 批): ①【P1-2 统一口径】新增唯一快照 _tx_pending_snapshot（词条 × 条目明细，db.pending_terms_full 同一 SQL）—— 库页徽章 / 待翻译明细 / 翻译预估 / worker 日志 / 完成通知全部只读这一份，「页面 3 = 日志 3 = API 3 = 库里真实 3」；废弃 pending_items_count / pending_items_list 第二套统计口径（明细不再逐条目各查一遍）；②【P1-6 Job 持久化】新增 SQLite 表 translate_jobs（schema v8）—— 每次消费许可 / 重新翻译生成 Job（queued→running→rate_limited/quota_paused→done/partial/failed/interrupted），限流与配额记 next_retry_at；进程重启 mark_stale 标记 interrupted，force 任务的 payload 自动重新入队（不再「重启即丢，再点一次重新翻译」）；新增 GET /translate/jobs 与 /db/pending_snapshot；③【P1-7 写回状态拆分】WritebackDb.stats + 库页新增独立「待写回」徽章 —— 翻译完成 ≠ 写回完成（写回 pending/writing/failed 独立计数，与「待翻译」并列展示）；④【P2-1/2 可观测】LLM 日志改为 job=… batch=N/M request=N 溯源 + returned=… latency=… tokens~=…；新增 stat_tokens_in/out、stat_latency_ms（供应商返回 usage 用实际值，否则估算），Job 结束日志输出令牌与 API 延迟合计；⑤【P2-3 TPM 预算门】新增设置项「TPM 令牌预算」（llm_tpm_budget，0=不限）—— 发请求前按「近 60 秒估算令牌 + 本次」预判，超出先等窗口滑出再发，显著减少 429→重试→再 429→熔断；⑥【P1-SET-03】「全部类型翻译」改为运行期覆盖 —— 不再在加载/保存时强制改写 role/actor/director/… 子开关（此前关闭后原选择已被永久改写、无法恢复），关闭即恢复用户原选择；⑦【P1-SET-04】后端执行门控补齐 —— AI 总开关关闭时后端直接拒绝「全部翻译」「人名池批量翻译」、Webhook/扫描自动翻译与池自动翻译按 enqueue_only 处理（不再只靠前端置灰）；⑧【P1-SET-06】TMDB 补译开关与 AI 总开关解耦 —— TMDB 查询不经 LLM，AI 关闭时同样可用（UI 不再禁用）；⑨【P1-SET-07】保留旧三套人数键兼容读取 + limits_unified 迁移标记，保存/重启不回跳。模拟测试 50/50 通过（真实源码 + 真 SQLite 库：唯一口径 / Job 持久化与重启恢复 / 写回拆分 / 令牌统计 / TPM 预算门 / SET 语义）
# v4.6.62(审查报告架构级整改 · 收尾：结构化输入 / Job 明细表 / Job 操作接口 / 状态收敛): ①【第 17 节 结构化输入】新增 llm_client.translate_items —— global（跨作品聚合）改为结构化输入 [{id,text,kind,title,year,item_id}]，模型按 id 一一对应返回 [{id,translation}]；不同作品出现相同原文时各自按作品上下文翻译，不再只依赖 {原文:译文}（串译根因）；_parse_response 同时支持 JSON 数组（按 id）与 legacy 字典（标量校验不变），新增 _extract_json_array 平衡括号提取；结构化提示词为内置模板（用户模板含 {items_json} 占位符时优先）；②【第 24 节 Job 明细表】新增 translate_job_terms（逐词条：term_id/item/kind/original_text/status/translation/retry_count）与 translate_job_batches（逐批次：batch_id/request_no/term_count/returned_count/input-output_tokens/耗时），schema v9 无损迁移；新增 save_terms / set_terms_status / terms_summary / list_terms / add_batch / list_batches / prune（只留最近 30 个已完成 Job）；Job 开始时登记待翻词条、每批结束留痕并回写词条状态（translated/failed）；GET /translate/jobs?job_id= 详情附 terms + batches；③【第 22/25 节 Job 操作接口】新增 POST /translate/jobs/create（手动建任务）、/translate/jobs/cancel（Job=cancelled，**不删 pending**，取消的是当前任务时请求 worker 归还许可）、/translate/jobs/resume（cancelled/interrupted 重新入队：force 按 payload 恢复条目、其它按原 source/scope 重新许可，复用同一 Job id）；终止时真正落 Job 状态（显式终止=cancelled，插件禁用/被动停止=interrupted）；修 resume 在「取消后 _tx_job_id 未清」时永远停在 cancelled 的缺陷；④【第 26 节第 2 步 状态收敛】新增 _TxJob 对象作为运行期单一数据源，_tx_requested / _tx_source / _tx_target_scope / _tx_scope_items / _tx_only_terms 五个散落全局字段改为 Job 对象视图（读写即进 Job），彻底淘汰多份状态漂移。模拟测试 51/51 通过（真实源码 + 真 SQLite 库：明细表读写/幂等/prune、create-cancel-resume 全链路、结构化按 id 匹配与同名不串译、Job 对象读写与 reset）
# v4.6.63(修「翻成功仍显示待翻 / 待写回不消失」): ①【根因·人数上限轮转】「每文件每类型前 N 个」此前把「未翻译」谓词写在内层（ROW_NUMBER 之前）→ 已翻完的行被排除后 ROW_NUMBER 重新排队，超出上限的人逐个「轮转补位」：上限=3、共 6 人时，翻完前 3 个后立刻又冒出后 3 个 → 日志「完成 3 / 剩余 3」永远翻不完、待翻译明细一直挂着（用户实测「明明都成功了还显示待翻」，且写回就绪判定因「还有待翻」永远不通过 → 自动写回也不落盘）。现改为**硬上限**：先按 person_index 取「该文件该类型前 N 个人」这个固定集合，再在集合内筛未翻译 → 上限内翻完即归零，上限外的人不动。②【手动写入不更新写回状态】`/db/restore`（单条「写入」）与「全部写回」此前只写文件、从不更新 writeback_state → 「待写回」徽章点了写入也不消失（用户：难道必须点全部写回？）；现在写入成功即标 done、文件不存在标 missing，两个入口一致。③【完成数不再虚报】「完成 N 条」改用 batch_apply_translations 的**真实写库行数**（写入 0 行时记 WARNING 提示「键不匹配或译文等于原文」，不再谎报成功）。④【日志自证】翻译结束日志新增「写库 N 行」与「剩余词条：…（前 5 条）」—— 一眼看出到底还剩哪些、是不是刚翻过的那些。模拟测试 11/11 通过（真实源码 + 真 SQLite：上限内翻完/上限外不动/仅 1 次请求/译文等于原文不虚报/写回状态归零）
# v4.6.64(第二轮审查 · occurrence 化收口：跨作品同名不再互相污染): ①【P0-1 普通翻译写库】废弃全局按原文 UPDATE —— 新增 PeopleDb.apply_translations_occurrence：按 occurrence 精确定位键（plugin_id + server_id + item_id + COALESCE(season_num) + COALESCE(episode_num) + person_index + kind + 原文）更新；此前 `WHERE plugin_id=? AND name_before=?` 会把其它作品同名行一起改掉（已实测复现：B/C 两个 item 都叫 Same，翻 B 连带改 C）。②【P0-2 聚合 occurrence 化】新增 _tx_occ_id / _tx_occurrences / _tx_pick_batch —— 流水线全程以 occurrence 为单位（**不再按原文字符串去重**，同名原文在多个作品各自成条），_tx_llm_chunks 恒结构化输入（每条带 occ_id/kind/title/item_id），模型按 id 一一对应返回；global 聚合不再丢上下文。③【P0-3 精确匹配】_tx_translate_mixed 的 hits/llm/failed/deferred 与写库行全部以 occ_id 为键；译文与 occurrence 一一对应。④【P0-4 Job 明细】_tx_job_note_batch 改为按 occ_id 置状态（删除 original_text 反查扩散逻辑）；translate_job_terms 的 term_id 即 occ_id（含季/集/序号），一个 occurrence 成功不会误标另一个同名 occurrence。⑤【P0-9 路径统一】「重新翻译」改从 DB 取 occurrence（force_item_occurrences，限到该条目、only_pending=False）并以 override=True 覆盖旧译文 —— 重翻与普通翻译共用同一套 occurrence 精确写库，不再有「重翻精确 / 普通翻译全局误写」的双轨。⑥【P1-5/6 HTTP 留痕】LLMClient 新增 attempts 留痕（每次 HTTP attempt 先记后更，429/5xx/401 与失败重试都留痕）+ drain_attempts()；插件层 _tx_job_flush_attempts 落进 translate_job_batches（补全 http_status / error_kind / attempt_count / started_at / finished_at）。⑦【P1-7/8 边界与文案】后端数值 clamp 与 UI 对齐：请求间隔 0~600、单批条数 1~200、扫库间隔 ≤720、探测间隔 ≤1440、失效宽限 0~720、超时 1~3600；设置页「单批翻译条数」改名「单批最多翻译条数」并补 min/max。⑧【P2-11】明确 llm_max_rpm 为历史兼容字段（限速统一为「请求间隔 + TPM 预算」，RPM 恒 0 不启用）。模拟测试 25/25 通过（真实源码 + 真 SQLite：跨作品同名不污染 / occurrence 写库精确性 / Job 明细独立 / 429 留痕 / 人数上限硬上限 / 数值 clamp）
# v4.6.65(完成通知补充「AI 请求次数」): 翻译完成推送此前只有 完成条数/剩余/待写回/耗时，看不出「这轮到底调了几次 AI」；现在通知新增一行「🤖 AI 请求 N 次（成功 X · [失败/限流/配额 非零才显示]）」，与日志里的 [TranslateJob] 统计同源（均为本轮 stat_* 差值），一眼可核对「6 条 = 1 次请求」这类聚合效果。仅通知文案变更，无逻辑改动。
# v4.6.66(Webhook 删除→恢复 + 库页可见性 + 通知口径 全面修复): ①【P0-1/P0-2 身份分离】Webhook 入库行此前把 server_id 写死为空、Emby ItemId 与媒体 item_id 混用 → 库页按服务器查不到、删除→恢复匹配错乱；现全链路（Webhook → 同剧聚合 → Series 展开 → _record_nfo_library → upsert_people）传真实 server_id，Emby ItemId 单存新列 emby_item_id（schema v10 无损迁移），旧库遗留空来源行按 nfo_path 自动迁移。②【P0-3/P0-4 恢复不重翻】upsert_people 写库前读旧行、按「序号→原文」匹配：原文未变且旧译文存在的行直接继承 name_after/role_after + translated_at，只有新增/变化词条进 pending —— 修复「文件明明是翻译好的，恢复后反而变成未翻译英文、还要重翻」。③【P0-5 恢复清事件】_remove_missing_event 改完整身份匹配（Emby ItemId / 媒体 id / server_id / 剧名 / 季集 / 标题）；整剧删除事件（常无 SeriesName、Name 即剧名）恢复后能清；单集恢复只清该集事件，剧级事件要「该剧被删记录全部恢复（不再有观察期行）」才清 —— 删 1 集 → 删 2 集 → 整部删 → 陆续恢复不误清、不残留。④【P0-6 库页可见】来源判定由「server_id 是否为空」改为「是否有本地 nfo_path」；单集入库时该剧缺剧级行（tvshow.nfo 未单独入库）自动补写 —— 修复「数据库有人名池也有、库里就是显示不出来」。⑤【P1 通知口径】待翻数改为按**当前翻译范围**统计（目标范围 + 类型开关 + 人数上限 + 已是中文跳过，与 worker 收词同口径），通知拆分「📥 采集 N 词条 ｜ ✅ 已有译文 M 条（未重翻）｜ 🤖 待翻 K 个」。⑥【P1 仪表盘刷新】修复 Webhook 开关改了仪表盘提示不消失（必须进出插件）：轮询加单请求超时防「悬挂请求锁死轮询」，切页（refreshKey）/重新激活/窗口回前台立即强制刷新。⑦【维护/探测联动】维护线程与探测反向检查的删除标记改按条目各自来源（P0-1 后 Webhook 行带真实 server_id，旧代码只按 '' 标记会整体漏掉）；维护列表与反向检查补 server_id 隔离，多服务器同名剧互不误标/误清。模拟测试 53/53 通过（真实源码 + 真 SQLite 库：身份落库/库页可见性/纯集组补剧级行/删除→恢复译文继承/极端删法事件时机/多服务器隔离/通知口径/文案）。
# v4.6.67(审查报告 4.6.66 复核 · P0/P1 七项): ①【P0-A 删除来源隔离】`mark_deleted_by_nfo_path` / `mark_deleted_by_nfo_path_prefix` / `is_deleted_by_nfo_path` 新增 `server_id`，Webhook 删除与恢复判定全部传入来源服务器；新增 db._scope_sql_soft（指定服务器 = 该服务器 + 旧版遗留空来源行）—— 此前两台 Emby 映射到同一 nfo 路径时，A 服删除会把 B 服同路径记录一起标失效、B 服入库又被 A 服观察期误判成「恢复」；本地维护线程（同一文件系统）显式 server_id=None 保持不限定。②【P0-B 定时扫描语义】`_run_scheduled_scan` 删除 `interval>=24h → 每天 04:00` 的日历分支，一律按「上次执行 + 设置间隔」判定 —— 用户把「间隔小时」设成 48/72 时不再被静默改成每天一次（`_last_full_scan_ts` 已持久化，重启不重新计时）。③【P0-C 通知口径】入库阶段不再把「NFO 文件数」当「翻译条数」：`_notify_webhook_completed` / `_add_notification_to_queue` 新增 `ingested`（入库 NFO 数），三处入库调用点 translated 恒 0；通知按实际动作命名「📥 入库完成 / ✅ 翻译完成 / 🔄 恢复完成」，入库批次显示「📥 入库 NFO N 个 ｜ ❌ 失败 M 个」，修「3 个 NFO 入库显示成『✅ 翻译：3 条』」。④【P0-D 有效角色开关】TMDB 第二排角色补译触发改用 effective role（`_tr['role']` = 全部类型 OR 角色总开关），修「开全部类型但历史 translate_role=false → 翻译会翻角色、却不补角色」；设置页该开关禁用条件与说明同步（含「或全部类型」、入库/扫描含 Webhook）。⑤【P1-E 简介解耦】TMDB 中文简介写回不再要求「同时有中文名」——仅 bio 存在即写 Overview（锁定），与 UI「中文简介即时写回」一致。⑥【P1-F 0=不限】nfo.NfoDoc.collect 人数上限 N<=0 改为「不限（该类型全收）」，与 DB pending 查询口径统一（此前本层把 0 当『该类型不采集』，导致扫描收集统计与库内待翻数字对不上）。⑦【P1-G 文案】人名池拉取日志「跟随翻译范围」→「按人名池独立设置」（拉取类型本就是独立配置）。模拟测试 25/25 新增通过；全套回归 284 项 0 失败。
# v4.6.68(「处理单集」全入口一致门禁 + 来源判定联动修复): ①【P0 统一门禁】「处理单集」此前只决定扫描时是否逐个处理单集 NFO 文件，翻译链路（待翻/预估/worker 收词/写回就绪）完全没有门禁 —— 关闭时 Episode 层级行仍会进 pending 被翻译、调 AI。现新增 db._excl_ep_sql 并贯穿全部待翻查询：pending_terms / pending_terms_full / force_item_occurrences / force_item_terms / pending_items_count / pending_items_list / pending_terms_of_item / find_pending_items；插件层新增 _tx_exclude_episodes()（= 非「处理单集」）并在 9 处调用点全量传入 —— 扫描 / 定时扫描 / 探测库 / Webhook / Series 展开 / 删除恢复 各入口口径完全一致：关时 Episode 可入库（供库页查看/编辑）但不进 pending、不调 AI；开时正常进 pending 与 Worker。②【P0 联动修复】pending_terms / pending_terms_full / pending_items_count / pending_items_list 的 scan_mode 来源判定由「server_id 是否为空」改为 db._scan_scope_sql（按 nfo_path），与库页同一口径 —— P0-1 后 Webhook 行带真实 server_id，此前会被 scan_mode=nfo 误排除，导致「全部翻译」漏掉 Webhook 入库的条目。③【写回就绪】pending_terms_of_item 带门禁 —— 关时集记录不再因「永远未翻完」而阻塞写回；find_pending_items 带门禁 —— 写回 worker 不再无限重拾不参与翻译的 Episode 条目。新增模拟测试 19/19；全套回归 303 项 0 失败。
